function quiz(el, qs, o){
  o = o || {};
  var items = shuffle(qs.slice()).map(function(q){
    var order = shuffle(q.o.map(function(_,k){return k;}));
    return { q:q.q, e:q.e, n:q.n, opts:order.map(function(k){return q.o[k];}), a:order.indexOf(q.a) };
  });
  var i = 0, score = 0;
  function show(){
    var it = items[i];
    el.innerHTML = '<div class="qz"><div class="qz-top"><span>'+(i+1)+' / '+items.length+'</span><div class="bar"><i style="width:'+(i/items.length*100)+'%"></i></div></div>'+
      (o.showTopic && it.n ? '<p class="qz-tag">'+it.n+'-mavzu: '+esc(T[it.n-1].title)+'</p>' : '')+
      '<h3 class="qz-q">'+esc(it.q)+'</h3><div class="opts">'+it.opts.map(function(t,k){ return '<button class="opt" data-k="'+k+'">'+esc(t)+'</button>'; }).join('')+'</div><div class="fb" hidden></div></div>';
    $$('.opt', el).forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = +btn.getAttribute('data-k'), ok = k === it.a;
        if (ok) score++;
        $$('.opt', el).forEach(function(b, j){ b.disabled = true; if (j===it.a) b.classList.add('right'); else if (j===k) b.classList.add('wrong'); });
        var fb = $('.fb', el); fb.hidden = false;
        fb.innerHTML = '<strong class="'+(ok?'y':'n')+'">'+(ok?'To‘g‘ri.':'Noto‘g‘ri.')+'</strong> '+esc(it.e)+'<br><button class="btn sm fill" id="nx">'+(i+1<items.length?'Keyingi savol':'Natijani ko‘rish')+'</button>';
        $('#nx', el).addEventListener('click', function(){ i++; if (i<items.length) show(); else finish(); });
        $('#nx', el).focus();
      });
    });
  }
  function finish(){
    var pct = Math.round(score/items.length*100);
    var msg = pct===100 ? 'Ajoyib! Hammasi to‘g‘ri.' : pct>=70 ? 'Yaxshi natija. Xatolarni qayta ko‘rib chiqing.' : 'Mavzuni yana bir bor o‘qib, qayta urinib ko‘ring.';
    el.innerHTML = '<div class="res"><div class="big">'+score+' / '+items.length+'</div><p>'+msg+'</p><button class="btn fill" id="rt">Qayta topshirish</button></div>';
    $('#rt', el).addEventListener('click', function(){ quiz(el, qs, o); });
    if (o.onFinish) o.onFinish(score, items.length);
  }
  show();
}

/* ---- tezkor savol ---- */
var ALLQ = [];
T.forEach(function(t){ (QZ[t.n]||[]).forEach(function(q){ ALLQ.push({q:q.q,o:q.o,a:q.a,e:q.e,n:t.n}); }); });
function quick(el){
  var q = ALLQ[Math.floor(Math.random()*ALLQ.length)];
  var order = shuffle(q.o.map(function(_,k){return k;}));
  var opts = order.map(function(k){return q.o[k];}), a = order.indexOf(q.a);
  el.innerHTML = '<h2>Tezkor savol · '+q.n+'-mavzu</h2><p class="qq">'+esc(q.q)+'</p><div class="opts">'+opts.map(function(t,k){return '<button class="opt" data-k="'+k+'">'+esc(t)+'</button>';}).join('')+'</div><div class="fb" hidden style="color:var(--ink)"></div>';
  $$('.opt', el).forEach(function(btn){ btn.addEventListener('click', function(){
    var k = +btn.getAttribute('data-k'), ok = k===a;
    $$('.opt', el).forEach(function(b,j){ b.disabled = true; if (j===a) b.classList.add('right'); else if (j===k) b.classList.add('wrong'); b.style.color = 'var(--ink)'; });
    var fb = $('.fb', el); fb.hidden = false;
    fb.innerHTML = '<strong class="'+(ok?'y':'n')+'">'+(ok?'To‘g‘ri.':'Noto‘g‘ri.')+'</strong> '+esc(q.e)+'<br><button class="btn sm fill" id="qn" style="--c:#0E9F8E">Yana savol</button> <a class="btn sm" href="#/t/'+q.n+'" style="color:var(--ink)">Mavzuni ochish</a>';
    $('#qn', el).addEventListener('click', function(){ quick(el); });
  }); });
}

/* ---- yon panel ---- */
function sidebar(){
  $('#side').innerHTML = '<div class="side-h">Mavzular</div>' + T.map(function(t){
    return '<a class="tab '+cls(t.n)+'" href="#/t/'+t.n+'" data-n="'+t.n+'"><span class="tn">'+t.n+'</span><span class="tt">'+esc(t.title)+'</span><span class="ck" aria-label="o‘qilgan">'+(S.read.indexOf(t.n)>-1?'✓':'')+'</span></a>';
  }).join('');
}
function markSide(n){
  $$('.tab').forEach(function(a){
    var m = +a.getAttribute('data-n');
    a.classList.toggle('on', m===n);
    $('.ck', a).textContent = S.read.indexOf(m)>-1 ? '✓' : '';
  });
}
function mnav(r){
  return '<div class="mnav"><a href="#/" class="'+(r==='home'?'on':'')+'">Bosh sahifa</a><a href="#/cards" class="'+(r==='cards'?'on':'')+'">Kartochkalar</a><a href="#/test" class="'+(r==='test'?'on':'')+'">Test</a></div>';
}

/* ---- sahifalar ---- */
function home(){
  var done = S.read.length, pct = Math.round(done/T.length*100);
  app.innerHTML = mnav('home') + '<section class="hero"><h1>Huquq qo‘llanma</h1><p>8-sinf uchun davlat va huquq asoslari: 22 ta mavzu, kartochkalar va test bir joyda.</p>'+
    '<div class="prog t0"><div class="bar"><i style="width:'+pct+'%"></i></div><b>'+done+' / '+T.length+' mavzu o‘qildi</b></div></section>'+
    '<section class="quick" id="quick"></section>'+
    '<div class="actions"><a class="btn fill t1" href="#/cards">Kartochkalar bilan takrorlash</a><a class="btn fill t2" href="#/test">Umumiy testni boshlash</a></div>'+
    '<h2 class="sec">Mavzular</h2><div class="idx">'+T.map(function(t){
      var rd = S.read.indexOf(t.n)>-1, b = S.best[t.n];
      var st = (rd?'O‘qilgan':'O‘qilmagan') + ' · ' + t.mins + ' daqiqa' + (b!=null ? ' · test: '+b+'/3' : '');
      return '<a class="ic '+cls(t.n)+'" href="#/t/'+t.n+'"><span class="n">'+t.n+'</span><span><span class="t">'+esc(t.title)+'</span><span class="s'+(rd?' done':'')+'">'+st+'</span></span></a>';
    }).join('')+'</div>';
  quick($('#quick'));
}

function topicView(n, anchor){
  var t = T[n-1];
  if (!t){ return notFound(); }
  var rd = S.read.indexOf(n)>-1;
  var prev = T[n-2], next = T[n];
  app.innerHTML = '<div class="'+cls(n)+'">'+
    '<div class="th"><div class="num">'+n+'</div><div><h1>'+esc(t.title)+'</h1><div class="meta">O‘qish: taxminan '+t.mins+' daqiqa</div></div></div>'+
    '<article class="doc">'+t.blocks.map(function(b,i){ return block(b,n,i); }).join('')+'</article>'+
    '<div class="done-row"><span id="rs">'+(rd?'Bu mavzu o‘qilgan deb belgilangan.':'Mavzuni tugatdingizmi?')+'</span><button class="btn fill sm" id="rb">'+(rd?'Belgini olib tashlash':'O‘qildi deb belgilash')+'</button></div>'+
    '<section class="qbox"><h2>Bilimingizni sinang</h2><p>3 ta savol. Har bir javobdan keyin izoh ko‘rasiz.'+(S.best[n]!=null?' Eng yaxshi natijangiz: '+S.best[n]+'/3.':'')+'</p><div id="qz"></div></section>'+
    '<div class="pn">'+(prev?'<a href="#/t/'+prev.n+'"><small>Oldingi mavzu</small>'+prev.n+'. '+esc(prev.title)+'</a>':'<span></span>')+(next?'<a href="#/t/'+next.n+'"><small>Keyingi mavzu</small>'+next.n+'. '+esc(next.title)+'</a>':'<span></span>')+'</div></div>';
  $('#rb').addEventListener('click', function(){
    var i = S.read.indexOf(n);
    if (i>-1) S.read.splice(i,1); else S.read.push(n);
    save(); markSide(n);
    var r = S.read.indexOf(n)>-1;
    $('#rs').textContent = r ? 'Bu mavzu o‘qilgan deb belgilangan.' : 'Mavzuni tugatdingizmi?';
    $('#rb').textContent = r ? 'Belgini olib tashlash' : 'O‘qildi deb belgilash';
  });
  var qs = (QZ[n]||[]).map(function(q){ return {q:q.q,o:q.o,a:q.a,e:q.e,n:n}; });
  quiz($('#qz'), qs, { onFinish: function(sc){ if (S.best[n]==null || sc>S.best[n]){ S.best[n]=sc; save(); } } });
}

/* kartochkalar */
var CARDS = [];
T.forEach(function(t){ t.blocks.forEach(function(b,i){ if (b[0]==='D') CARDS.push({id:t.n+'-'+i, n:t.n, term:b[1], def:plain(b[2])}); }); });
var cardState = { topic:0, onlyNew:false, idx:0, order:null };
function deck(){
  var d = CARDS.filter(function(c){
    return (!cardState.topic || c.n===cardState.topic) && (!cardState.onlyNew || S.known.indexOf(c.id)===-1);
  });
  if (cardState.order && cardState.order.key === d.length+'-'+cardState.topic+'-'+cardState.onlyNew){
    return cardState.order.list;
  }
  cardState.order = { key:d.length+'-'+cardState.topic+'-'+cardState.onlyNew, list:d };
  return d;
}
function cardsView(){
  var d = deck();
  if (cardState.idx >= d.length) cardState.idx = 0;
  var c = d[cardState.idx];
  var knownCount = CARDS.filter(function(x){ return S.known.indexOf(x.id)>-1; }).length;
  app.innerHTML = mnav('cards') + '<h1 style="font:800 clamp(1.8rem,4vw,2.5rem)/1.1 var(--head);margin:0 0 6px;letter-spacing:-.02em">Kartochkalar</h1>'+
    '<p style="margin:0;color:var(--ink2)">Atamani o‘qing, ta’rifini eslang, so‘ng kartani aylantirib tekshiring. Bilganlaringiz saqlanadi: '+knownCount+' / '+CARDS.length+'.</p>'+
    '<div class="cbar"><select id="ct" aria-label="Mavzu bo‘yicha saralash"><option value="0">Barcha mavzular</option>'+T.map(function(t){return '<option value="'+t.n+'"'+(cardState.topic===t.n?' selected':'')+'>'+t.n+'. '+esc(t.title)+'</option>';}).join('')+'</select>'+
    '<label><input type="checkbox" id="cn"'+(cardState.onlyNew?' checked':'')+'> Faqat bilmaganlarim</label><button class="btn sm" id="sh">Aralashtirish</button></div>'+
    (c ? '<div class="fc '+cls(c.n)+'" id="fc"><div class="fci" id="fci" tabindex="0" role="button" aria-label="Kartani aylantirish"><div class="face fr"><div class="tg">'+c.n+'-mavzu</div><div class="tm">'+esc(c.term)+'</div><div class="hint">Aylantirish uchun bosing yoki bo‘sh joy tugmasini bosing</div></div><div class="face bk"><div class="tg">'+esc(c.term)+'</div>'+esc(c.def)+'</div></div></div>'+
      '<div class="cnav"><button class="btn sm" id="pv">Oldingi</button><button class="btn sm fill t2" id="ag">Takrorlayman</button><button class="btn sm fill t0" id="kn">Bilaman</button><button class="btn sm" id="nx">Keyingi</button></div>'+
      '<div class="cnt">'+(cardState.idx+1)+' / '+d.length+(S.known.indexOf(c.id)>-1?' · bilasiz':'')+'</div>'
    : '<div class="empty">Bu tanlovda kartochka qolmadi. Barchasini bilasiz! Saralashni o‘zgartiring.</div>');
  $('#ct').addEventListener('change', function(){ cardState.topic = +this.value; cardState.idx = 0; cardState.order = null; cardsView(); });
  $('#cn').addEventListener('change', function(){ cardState.onlyNew = this.checked; cardState.idx = 0; cardState.order = null; cardsView(); });
  $('#sh').addEventListener('click', function(){ var dk = deck().slice(); shuffle(dk); cardState.order = { key:dk.length+'-'+cardState.topic+'-'+cardState.onlyNew, list:dk }; cardState.idx = 0; cardsView(); });
  if (!c) return;
  var fc = $('#fc');
  var flip = function(){ fc.classList.toggle('flip'); };
  $('#fci').addEventListener('click', flip);
  var go = function(step){ var L = deck().length; cardState.idx = (cardState.idx + step + L) % L; cardsView(); };
  $('#nx').addEventListener('click', function(){ go(1); });
  $('#pv').addEventListener('click', function(){ go(-1); });
  $('#ag').addEventListener('click', function(){ var i = S.known.indexOf(c.id); if (i>-1){ S.known.splice(i,1); save(); } go(1); });
  $('#kn').addEventListener('click', function(){ if (S.known.indexOf(c.id)===-1){ S.known.push(c.id); save(); } if (cardState.onlyNew){ cardState.order = null; var L = deck().length; if (cardState.idx >= L) cardState.idx = 0; cardsView(); } else go(1); });
}

function testView(){
  app.innerHTML = mnav('test') + '<h1 style="font:800 clamp(1.8rem,4vw,2.5rem)/1.1 var(--head);margin:0 0 6px;letter-spacing:-.02em">Umumiy test</h1>'+
    '<p style="margin:0;color:var(--ink2)">Barcha mavzulardan aralash savollar. Nechta savol bilan boshlaymiz?</p>'+
    '<div class="setup"><button class="btn fill t0" data-c="10">10 ta savol</button><button class="btn fill t1" data-c="20">20 ta savol</button><button class="btn fill t2" data-c="'+ALLQ.length+'">Hammasi ('+ALLQ.length+')</button></div>'+
    '<div class="qbox t4" id="tq" hidden></div>'+(S.best.all!=null?'<p style="color:var(--muted)">Oxirgi natijangiz: '+S.best.all+'%</p>':'');
  $$('.setup .btn').forEach(function(b){ b.addEventListener('click', function(){
    var cnt = +b.getAttribute('data-c');
    var pick = shuffle(ALLQ.slice()).slice(0, cnt);
    var box = $('#tq'); box.hidden = false;
    quiz(box, pick, { showTopic:true, onFinish:function(sc, tot){ S.best.all = Math.round(sc/tot*100); save(); } });
    box.scrollIntoView({block:'start'});
  }); });
}

var INDEX = null;
function buildIndex(){
  INDEX = [];
  T.forEach(function(t){ t.blocks.forEach(function(b,i){ var x = blockText(b); if (x) INDEX.push({n:t.n,i:i,text:x,low:norm(x)}); }); });
}
function searchView(qraw){
  if (!INDEX) buildIndex();
  var q = norm(qraw.trim());
  var res = [];
  if (q.length>=2){
    for (var j=0;j<INDEX.length && res.length<40;j++){
      var p = INDEX[j].low.indexOf(q);
      if (p>-1) res.push({e:INDEX[j], p:p});
    }
  }
  app.innerHTML = mnav('') + '<h1 style="font:800 clamp(1.6rem,4vw,2.2rem)/1.1 var(--head);margin:0 0 14px;letter-spacing:-.02em">Qidiruv natijalari</h1>'+
    (q.length<2 ? '<div class="empty">Kamida 2 ta harf kiriting.</div>' :
     res.length===0 ? '<div class="empty">“'+esc(qraw)+'” bo‘yicha hech narsa topilmadi. Boshqa so‘z bilan urinib ko‘ring.</div>' :
     '<p style="color:var(--muted)">'+res.length+(res.length===40?'+':'')+' ta joy topildi</p>'+res.map(function(r){
       var s = Math.max(0, r.p-60), e = Math.min(r.e.text.length, r.p+q.length+90);
       var snip = r.e.text.slice(s,e);
       var a = r.p - s;
       var html = (s>0?'…':'')+esc(snip.slice(0,a))+'<mark>'+esc(snip.slice(a,a+q.length))+'</mark>'+esc(snip.slice(a+q.length))+(e<r.e.text.length?'…':'');
       return '<a class="sr '+cls(r.e.n)+'" href="#/t/'+r.e.n+'/b'+r.e.i+'"><b>'+r.e.n+'-mavzu: '+esc(T[r.e.n-1].title)+'</b><span>'+html+'</span></a>';
     }).join(''));
}
function notFound(){
  app.innerHTML = mnav('') + '<div class="empty">Bunday sahifa topilmadi. <a href="#/" style="text-decoration:underline">Bosh sahifaga qaytish</a></div>';
}

/* ---- yo‘naltirish ---- */
function route(){
  var h = (location.hash || '#/').slice(1);
  var parts = h.split('/').filter(Boolean);
  var r = parts[0] || 'home', n = 0, anchor = null;
  $$('.top nav a').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-r') === (r==='t'?'':r)); });
  document.body.classList.remove('drawer');
  if (r==='t'){ n = parseInt(parts[1],10); anchor = parts[2] || null; topicView(n, anchor); markSide(n); }
  else if (r==='cards'){ cardsView(); markSide(0); }
  else if (r==='test'){ testView(); markSide(0); }
  else if (r==='search'){ searchView(decodeURIComponent(parts.slice(1).join('/'))); markSide(0); }
  else if (r==='home'){ home(); markSide(0); }
  else { notFound(); markSide(0); }
  if (anchor){
    var el = document.getElementById(anchor);
    if (el){ var wrap = el.closest('.t0,.t1,.t2,.t3,.t4'); if (wrap) el.style.setProperty('--tr', getComputedStyle(wrap).getPropertyValue('--tr')); el.scrollIntoView({block:'center'}); el.classList.add('flash'); }
  } else { window.scrollTo(0,0); }
}

/* ---- boshqaruv elementlari ---- */
$('#menu').addEventListener('click', function(){ document.body.classList.toggle('drawer'); });
$('#scrim').addEventListener('click', function(){ document.body.classList.remove('drawer'); });
$('#theme').addEventListener('click', function(){
  var root = document.documentElement, cur = root.getAttribute('data-theme');
  if (!cur) cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var nx = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', nx); store.set('hq-theme', nx);
});
var savedTheme = store.get('hq-theme', null);
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
var qin = $('#q');
$('#sf').addEventListener('submit', function(e){ e.preventDefault(); if (qin.value.trim()) location.hash = '#/search/'+encodeURIComponent(qin.value.trim()); });
var tmr = null;
qin.addEventListener('input', function(){
  clearTimeout(tmr);
  tmr = setTimeout(function(){ var v = qin.value.trim(); if (v.length>=2) { history.replaceState(null,'','#/search/'+encodeURIComponent(v)); route(); } }, 350);
});
document.addEventListener('keydown', function(e){
  if ((location.hash||'').indexOf('#/cards')!==0) return;
  var tag = (e.target.tagName||'').toLowerCase();
  if (tag==='input'||tag==='select'||tag==='textarea') return;
  var fc = $('#fc'); if (!fc) return;
  if (e.key===' ' || e.key==='Enter' && e.target.id==='fci'){ e.preventDefault(); fc.classList.toggle('flip'); }
  else if (e.key==='ArrowRight'){ var b=$('#nx'); if (b) b.click(); }
  else if (e.key==='ArrowLeft'){ var p=$('#pv'); if (p) p.click(); }
});
window.addEventListener('hashchange', route);
sidebar(); route();
})();
</script>
