"use strict";
var D = {"topics":[{"n":1,"title":"O‘zbekiston Respublikasi mustaqil davlat","blocks":[["P","Har bir jamiyatning asosiy mezoni hisoblangan **inson huquqlari** xalqaro huquqning obyekti sifatida **1948-yilda** “Inson huquqlari umumjahon deklaratsiyasi”ning qabul qilinishi bilan rasman tan olindi. Ushbu hujjat **BMTning Bosh Assambleyasi** tomonidan qabul qilingan."],["S","O‘zbekiston Respublikasi mustaqil davlat sifatida quyidagi 13 ta huquqlarga ega:"],["N",["Daxlsizlik, o‘z hududida va chegarasiga egalik huquqi","Shaxslarni fuqarolikka qabul qilish va fuqarolikdan mahrum qilish huquqi","O‘z Konstitutsiyasi, kodekslari va qonunlarni qabul qilish huquqi","Qonun chiqaruvchi, ijro etuvchi va sud hokimiyatlarining faoliyatini yo‘lga qo‘yish huquqi","O‘z qurolli kuchlarini tashkil etish huquqi","Xalqaro huquq subyekti sifatida xorijiy mamlakatlar bilan mustaqil ravishda aloqalar o‘rnatish huquqi","O‘z mulkiga egalik, budjet, soliq va moliya tizimlarini tashkil qilish huquqi","O‘z sud tizimini tashkil qilish va sud ishlarini mustaqil yuritish huquqi","O‘z xaznasi va pul birligi – milliy valyutasini joriy qilish huquqi","O‘z gerbi, bayrog‘i, madhiyasi va poytaxtiga ega bo‘lish huquqi","Davlat tiliga egalik huquqi","O‘z taraqqiyot yo‘lini, o‘z nomini, o‘z ma’muriy tuzilishini o‘zi belgilash huquqi","Referendum o‘tkazish hamda hokimiyat va boshqaruv organlari tarkibini belgilash huquqi"]],["P","Prezidentimiz tashabusi bilan **2017–2021-yillarda** O‘zbekiston rivojlantirishning **5 ta ustuvor yo‘nalishi** bo‘yicha **Harakatlar strategiyasi** qabul qilingan."],["P","Harakatlar strategiyasining **Qonun ustuvorligini ta’minlash va sud-huquq tizimini yanada isloh qilish** deb nomlangan **2-yo‘nalishida** “fuqarolarning huquq va erkinliklarini ishonchli himoya qilish kafolatlarini mustahkamlash” alohida belgilab qo‘yilgan."],["Q","Bizning faoliyatimiz eng muhim konstitutsiyaviy qoidaga – ijtimoiy adolat tamoyilini ta’minlashga qaratilishi shart.","Shavkat Mirziyoyev"],["D","Ijtimoiy adolat","bu siyosiy qarashlari, jinsi, millati, tili va diniy e’tiqodidan qat’i nazar, **qonun oldida barcha fuqarolarning tengligini** ta’minlashdir."]]},{"n":2,"title":"Shaxs","blocks":[["D","Individ","har bir alohida odam."],["D","Shaxs","o‘ziga xos xususiyatlar, xohish-istaklar, orzu va intilishlar, bilim, ko‘nikma, malakalarga ega, **ma’naviy dunyosi boy** bo‘lgan inson tushuniladi."],["P","Insonning **ma’naviy boyligi** – uning dunyoqarashi, xulqi, odobi, madaniyati kabi ruhiy dunyosi bilan bog‘liq fazilatlari **inson kapitalining** asosiy tashkil etuvchilaridan hisoblanadi."],["D","Inson kapitali","mamlakatimizning jahon arenasidagi **raqobatbardoshligini** ta’minlab beradigan omildir."]]},{"n":3,"title":"Jamiyat","blocks":[["P","Eng qadimgi zamonlarda — **ibtidoiy jamoa tuzumi** davrida odamlar orasida o‘ziga xos qoidalar mavjud bo‘lgan."],["D","Jamiyat","birgalikdagi hayotiy faoliyatlari jarayonida birlashgan odamlarning muayyan murakkab tuzilmasidir. Bu tuzilma unga kirgan a’zolar, ya’ni odamlarning oddiy guruhi yoki to‘plami emas, balki **muayyan qoidalarga asosan birlashgan jamoasidir**."],["D","Jamiyat (qisqacha)","muayyan hududda yashovchi, o‘z ehtiyoj va manfaatlariga ko‘ra birlashgan kishilardan iborat jamoa."],["P","Jamiyat turli odamlarning oddiy guruhi yoki jamoasi emas. Jamiyat – murakkab ijtimoiy tuzilma. U – odamlarning o‘zaro munosabatlari, aloqalari mahsuli."],["P","Boshqacha aytganda, jamiyat **biologik qonunlar emas, balki odamlarning ijtimoiy qonunlari** ustuvor bo‘lgan, muayyan shakllangan mushtarak birligidir."],["E","Jamiyat – arabcha so‘z bo‘lib, jamoa, jamlangan, birlashgan degan ma’nolarni bildiradi."],["K","ESLAB QOLING","Har qanday jamoa ham jamiyat bo‘lavermaydi. Lekin istalgan jamiyat jamoa hisoblanadi."],["Q","Oila jamiyatning asosiy bo‘g‘inidir hamda jamiyat va davlat muhofazasida bo‘lish huquqiga ega. Nikoh tomonlarning ixtiyoriy roziligi va teng huquqliligiga asoslanadi.","Konstitutsiya, 76-modda"]]},{"n":4,"title":"Davlat","blocks":[["D","Davlat","jamiyatning shakllangan **siyosiy instituti**."],["P","Davlatlarning tashkil topishi bu — insoniyatning ibtidoiy jamoa tuzumidan **sivilizatsiya** tomon burilishi edi. Dunyoda birinchi sivilizatsiyalashgan davlatlarning paydo bo‘lishi Qadimgi Sharqda **miloddan avvalgi IV—III ming yilliklar** davriga to‘g‘ri keladi. Markaziy Osiyo hududida miloddan avvalgi I ming yillikning boshlarida ilk davlat uyushmalari paydo bo‘la boshlagan."],["P","Miloddan avvalgi I ming yillikning birinchi yarmida, **miloddan avvalgi VII–VI asrlarda** O‘zbekiston hududida ilk davlatlar **Qadimgi Xorazm** va **Qadimgi Baqtriya** paydo bo‘lgan davrdanoq mamlakatimizda davlatchilik asoslari uzil-kesil tashkil topdi. Qadimgi Xorazm va Baqtriya davlatlari uyushmasi-ittifoqi hududiga Sirdaryodan O‘rta Afg‘onistongacha bo‘lgan yerlar kirgan. Xorazm davlatining markazi **Ko‘zaliqir (Xorazm)** shahri bo‘lgan."],["D","Abu Ali ibn Sino (980–1037)","mashhur qomusiy olim, tabib, tibbiyotshunos, tabiatshunos, faylasuf, agronom, tilshunos, matematik, musiqashunos, **huquqshunos**, yozuvchi va shoirdir. Jahonga “**Shayx-ur-rais**” (“Olimlar rahbari”) nomi bilan ham tanilgan. Ibn Sino huquqshunoslikka oid bir qancha g‘oyalar va fikrlar muallifidir. Uning jamiyat, fuqarolik, davlat boshqaruviga oid g‘oyalari, ayniqsa, qimmatlidir. Ilmiy-adabiy merosini **450 dan ortiq** asarlar tashkil etadi, shulardan **160 taga yaqini** bizgacha yetib kelgan."],["D","Davlat (to‘liq ta’rif)","**majbur qilish kuchiga**, ya’ni hokimiyatga ega bo‘lgan, o‘z fuqarolari, shuningdek, hududida istiqomat qiluvchi barcha insonlarning manfaatlarini himoya qiladigan, boshqa davlatlar bilan siyosiy, iqtisodiy, madaniy aloqalarni amalga oshiradigan mustaqil siyosiy tashkilotdir."],["D","Amir Temur (1336–1405)","Bobokalonimiz Amir Temur tomonidan o‘rta asrlarda barpo qilingan davlatda uni oddiy jamiyatdan ajratib turuvchi barcha belgilar mavjud bo‘lgan. **Amir Temur Ko‘ragon ibn Amir Tarag‘ay Bahodir** – yirik davlat arbobi, yengilmas sarkarda, o‘rta asrlarda eng katta davlatlardan birining bunyodkori, tashqi munosabatlarda eng oqil yo‘llarni topa bilgan rahbar, jang san’ati va qonunlarini ishlab chiqqan mashhur lashkarboshi."],["Q","Davlatu saltanat uch narsa bilan: mulk, xazina va lashkar bilan tikdir. Dono vazir bularning har uchalasini tadbirkorlik bilan yaxshi ahvolda saranjom tutadi.","Amir Temur — Hikmatlar xazinasidan"],["Q","Xalq davlat idoralariga emas, davlat idoralari xalqimizga xizmat qilishi kerak.","Shavkat Mirziyoyev"]]},{"n":5,"title":"Davlat funksiyalari","blocks":[["D","Davlatning funksiyalari","davlat faoliyatining **asosiy yo‘nalishlari** bo‘lib, ularda davlatning ijtimoiy jihatlari ro‘yobga chiqariladi."],["P","Davlatning funksiyalarini o‘rganishda bu funksiyalarni **tasniflash (guruhlash)** uslubi qulaydir. Tasniflashni quyidagi mezonlar bo‘yicha amalga oshirish maqsadga muvofiqdir:"],["N",["**Faoliyat ko‘rsatish makoni bo‘yicha:** ichki; tashqi.","**Faoliyat ko‘rsatish muddati bo‘yicha:** doimiy; vaqtinchalik.","**Ijtimoiy jihatdan muhimligi bo‘yicha:** asosiy; asosiy bo‘lmagan.","**Amalga oshirishning huquqiy shakli bo‘yicha:** huquqni ijod qilish; huquqni ijro qilish; huquqni muhofaza qilish (qo‘riqlash)."]],["P","Davlatning **ichki funksiyalariga** mamlakat ichida amalga oshiriladigan funksiyalar kiradi. Mamlakat tashqarisida amalga oshiriladigan funksiyalar esa davlatning **tashqi funksiyalarini** tashkil qiladi."],["grid",[["Iqtisodiy vazifalar",["Iqtisodiy siyosatni ishlab chiqish va iqtisodiyotga ta’sir o‘tkazish","Iqtisodiyotning davlat sektori (zavod-fabrikalar, elektrostansiyalar, konlar)ni boshqarish","Bozor munosabatlarining huquqiy asoslari va narx siyosatini yo‘lga qo‘yish"]],["Ijtimoiy vazifalar",["Aholining yordamga muhtoj qismini himoyalash","Sog‘liqni saqlash va ta’lim tizimini qo‘llab-quvvatlash","Aholini ijtimoiy ne’matlar bilan ta’minlash"]],["Siyosiy-huquqiy vazifalar",["Fuqarolarning huquq va erkinliklarini himoya qilish","Qonuniylik va tartibni ta’minlash","Tinchlik va millatlararo totuvlikni saqlash"]],["Madaniy-ma’rifiy vazifalar",["Ilm-fan, ta’limni rivojlantirish","Milliy madaniyatni va san’atni rivojlantirish"]],["Moliyaviy vazifalar",["Soliq tizimi va bojxona nazorati","Pul aylanmasi ustidan nazorat","Moliya sohasidagi boshqa faoliyatlar"]],["Xavfsizlik va himoyalash vazifalari",["Aholining huquq va erkinliklarini ta’minlash","Tabiat muhofazasi","Mulk daxlsizligini ta’minlash","Huquqiy tartibotni o‘rnatish"]]]],["P","Har qanday davlat jahondagi boshqa davlatlar bilan turli aloqalarni yo‘lga qo‘yishga majbur. Shundagina u jahon hamjamiyati tomonidan tan olinishi mumkin. Bu aloqalarga quyidagilarni kiritsak bo‘ladi:"],["chips",["Diplomatik aloqalar","Savdo-sotiq aloqalari","Madaniy aloqalar","Harbiy aloqalar va boshqalar"],4],["P","Davlatning mavjudligi, uning zarurligi davlatning funksiyalarida o‘z aksini topadi."],["funcs"],["K","DAVLAT TURLARI","Davlat quyidagi asoslarga ko‘ra turlarga bo‘linadi: **boshqaruv shakli; hududiy tuzilishi; siyosiy tartib (rejim).**"]]},{"n":6,"title":"Davlat boshqaruv shakli","blocks":[["D","Davlat shakllari","davlatning **boshqaruv, hududiy tuzilishi va siyosiy tartibi** jihatidan qanday shakllarga bo‘linishi tushuniladi."],["D","Boshqaruv shakli","davlat hokimiyati, uning idoralarining aholi bilan o‘zaro munosabatlari, aholining ushbu idoralarni shakllantirishda ishtirok etish darajasi tushuniladi."],["P","Boshqaruv shakliga ko‘ra davlatlar **monarxiya** va **respublika** turlariga bo‘linadi."],["D","Monarxiya","oliy hokimiyat **yakka hokim** – davlat boshlig‘ining qo‘lida bo‘lgan davlat boshqaruv shakli. Bunda hokimiyat aksariyat hollarda yakka-hokim (monarx)ning farzandlariga, ayrim hollarda esa yakka-hokimning qaroriga ko‘ra boshqa shaxsga meros bo‘lib o‘tadi."],["E","Monarxiya – yunoncha so‘z bo‘lib, yakka hokimlik ma’nosini bildiradi."],["S","Monarxiyaning asosiy belgilari"],["N",["monarx davlatni shaxsiylashtiradi, tashqi va ichki siyosatda davlat boshlig‘i sifatida maydonga chiqadi","monarx davlatni yakka o‘zi boshqaradi","monarx hokimiyati muqaddas va ilohiy deb e’lon qilinadi","monarx o‘z faoliyatida mustaqildir","hokimiyatni o‘rnatish, qabul qilishning alohida tartibi mavjud","umrbod boshqaruv","monarx o‘z boshqaruvining natijasi uchun yuridik jihatdan javobgar emas"]],["P","Monarxiya **mutlaq** va **cheklangan (yoki parlamentar)** shakllarda bo‘ladi."],["D","Mutlaq monarxiya","monarx o‘z davlatini boshqarishda uning boshqaruvi boshqa biron bir idora bilan **cheklanmasa**."],["D","Cheklangan monarxiya","monarxning hukmronligi **konstitutsiyaga tayanuvchi** biron-bir idora bilan cheklangan bo‘lsa, bunday monarxiya cheklangan, konstitutsiyaviy, parlament boshqaruvi shaklidagi monarxiya bo‘ladi."],["D","Respublika","davlat boshqaruvining shunday shakliki, unda hokimiyat oliy idoralari **ma’lum muddatga saylanadi**."],["E","“Respublika” so‘zi yunoncha “umumiy ish” ma’nosini bildiradi."],["S","Respublikaning asosiy belgilari"],["N",["hokimiyat oliy idoralarining saylab qo‘yilishi","hokimiyat vakolatlarining taqsimlanishi","hokimiyat oliy idoralarining o‘z qarorlarini saylangan muddati davomida qabul qilishi","odil sudlovni amalga oshiruvchi idora bo‘lgan sudlar obro‘sining ortishi","fuqarolarning davlat ishlarini boshqarishda ishtirok eta olishi"]],["P","Respublikalar **prezidentlik respublikasi** va **parlamentar respublika** turlariga bo‘linadi."],["D","Prezidentlik respublikasi","davlatni bevosita xalq saylaydigan va juda **keng vakolatlarga** ega bo‘lgan Prezident boshqaradi. U ijro hokimiyatining bevosita boshqaruvchisi hisoblanadi."],["D","Parlamentar respublika","davlat boshlig‘i – prezident saylanuvchi mansabdor shaxs bo‘lib, asosan, **parlament tomonidan saylanadi**."],["T",["Prezidentlik respublikasi","Parlamentar respublika"],[["AQSH","Italiya"],["Braziliya","Germaniya"],["Argentina","Gretsiya"],["Meksika","Irlandiya"],["","Hindiston"],["","Portugaliya"]],[1,1]],["Q","Fozil davlat uning aholisi o‘zaro yordam berishiga, insonparvarlikka, insoniy mehr-oqibatga, uning eng oliy boylik ekanini payqab olishga, yaxshilashga asoslanish kerak.","Farobiy"],["Q","Agar hokimiyat atrofida adolat hukm surmasa, u inqirozga yuz tutadi.","Abu Bakr Xorazmiy"],["Q","Davlat ishlarining to‘qqiz ulushi kengash, tadbir va mashvarat, qolgan bir ulushi esa qilich bilan bajo keltirilishini angladim.","Amir Temur"],["Q","Podshoh o‘zlarini adolat bilan bezatishlari kerak, xalq bunday podshohga ehtirom ko‘rsatishi zarur.","Abdulloh Muqni"]]},{"n":7,"title":"Davlatning tuzilish shakli","blocks":[["P","Davlatlar tuzilish jihatidan **oddiy (unitar)** va **murakkab (federativ, konfederativ)** bo‘lishi mumkin. Demak, davlat tuzilish shakliga ko‘ra **2 ga** bo‘linadi: oddiy va murakkab."],["S","Unitar davlatning belgilari"],["N",["yagona konstitutsiya, yagona qonunchilik tizimining mavjudligi","yagona armiyaga ega bo‘lish","yagona pul birligi amal qilishi","tarkibiy qismlar, ya’ni ma’muriy-hududiy tuzilmalarga bo‘linish","barcha ma’muriy-hududiy birliklar uchun umumiy bo‘lgan soliq va kredit siyosatining joriy qilinganligi","yagona fuqarolikning mavjudligi"]],["P","Unitar davlatda butun bir mamlakat miqyosida umumiy tizimga ega bo‘lgan qonunchilik, ijroiya va sud idoralari bo‘ladi."],["E","Unitar — lotincha so‘z bo‘lib, oddiy, yagona degan ma’noni bildiradi."],["S","Federativ davlatning belgilari"],["N",["federatsiya hududi uning subyektlari hududi yig‘indisidan iborat bo‘ladi","oliy qonun chiqaruvchi, ijro etuvchi va sud hokimiyati federal davlat idoralariga tegishli bo‘ladi","federatsiyaning umumiy konstitutsiyasi uning subyektlari va federatsiyaning o‘zi o‘rtasidagi huquqiy munosabatlarni belgilaydi","federatsiya subyektlarining har biri alohida o‘z konstitutsiyasi, o‘zlarining oliy qonun chiqaruvchi, ijro etuvchi va sud organlariga ega bo‘ladi","federatsiya oliy qonun chiqaruvchi idorasi odatda ikki palatali bo‘ladi. Bunda yuqori palata federatsiya a’zolarining manfaatlarini ifoda etadi"]],["P","Unitar davlatdan farqli o‘laroq federativ davlat **murakkab davlat tuzilmasi** hisoblanadi. Federativ davlat bir necha davlatlarning birlashuvidan hosil bo‘ladi. Ularning subyektlari shtat, o‘lka, respublika, amirliklar deb atalishi mumkin. Federatsiya subyektlari o‘z ma’muriy-hududiy bo‘linmalariga ega."],["P","Ushbu davlatlar o‘zaro birlashganidan keyin federatsiya a’zolari hisoblanib, asosiy hokimiyat vakolatlari federatsiyaning markaziy organlariga beriladi."],["D","Federativ davlat","bir necha davlatlarning birlashuvidan hosil bo‘lgan **murakkab, ittifoqdosh** davlat."],["P","Hozirda jahonda **20 tadan ko‘proq** federativ davlatlar mavjud. Federatsiya va uning subyektlari o‘rtasidagi munosabatlar har doim ham ijobiy bo‘lavermaydi. Buni tarqalib ketgan **Sovet Ittifoqi, Chexoslovakiya, Yugoslaviya** kabi federatsiyalar misolida ko‘rishimiz mumkin."],["S","Konfederatsiya belgilari"],["N",["mustaqil davlatlar muayyan maqsadlarga erishish uchun birlashadi","konfederatsiya mustahkam bo‘lmagan tuzilma","yagona hudud mavjud bo‘lmaydi (konfederatsiyaning hududi uning a’zolari bo‘lgan davlatlar hududidan tashkil topadi)","umumiy fuqarolik mavjud bo‘lmaydi","konfederatsiya a’zolari undan erkin chiqish huquqiga ega bo‘ladilar","konfederatsiya a’zolari ittifoq hokimiyati qonun hujjatlarini e’tirof etmaslik yoki qo‘llamaslik (nulifikatsiya qilish) huquqiga ega bo‘ladilar","konfederatsiya vakolatiga uncha ko‘p bo‘lmagan masalalarni hal etish kiradi","konfederatsiya sarmoyasi uning a’zolarining ixtiyoriy badallaridan tashkil topadi"]],["D","Konfederatsiya (lotincha – ittifoq, uyushma)","suvereniteti va mustaqilligini saqlab qolgan holda biror-bir maqsadga erishish uchun birlashgan **davlatlar ittifoqi**."],["P","Davlatlar u yoki bu maqsadni ko‘zlab, o‘z suvereniteti va mustaqilligini saqlagan holda birlashishlari ham mumkin. U holda bunday ittifoq konfederatsiya deyiladi. Konfederatsiyada yagona hudud, yagona fuqarolik bo‘lmaydi. Har bir davlat xalqaro huquqning teng huquqli subyekti bo‘ladi."],["K","ESLAB QOLING","Davlatning tuzilish shakli — uning **ma’muriy-hududiy tashkil etilishidir.**"]]},{"n":8,"title":"Siyosiy tartibot (rejim). Davlat organlari. Davlat mexanizmi","blocks":[["D","Siyosiy tartibot","davlat hokimiyatini amalga oshirish **usullari va uslublari tizimi**. Ya’ni, hokimiyat ustida turgan siyosiy kuchlarning davlatni boshqarishda qo‘llaydigan usullari va uslublarining yaxlit tizimi."],["P","Siyosiy tartibot asosan ikki xil bo‘ladi: **demokratik** va **nodemokratik**."],["S","Demokratik davlat belgilari"],["N",["shaxsning iqtisodiy jihatdan erkin bo‘lishi","inson va fuqaro huquqlari va erkinliklarining e’tirof qilinishi va kafolatlanishi","davlat boshqaruvi ozchilikning ko‘pchilikka bo‘ysunishi tamoyili asosida amalga oshirilishi","hokimiyat vakolatlarining bo‘linishi","ijtimoiy hayotda fikrlar xilma-xilligi (pluralizm), ijtimoiy-siyosiy birlashmalarning ko‘pligi","qonun ustuvorligi"]],["P","Demokratik tartibot sharoitida insonning siyosiy va fuqarolik huquqlari hurmat qilinadi. Fuqarolar davlat hokimiyat idoralarini tuzishda va ularning faoliyatida faol ishtirok etadilar. Demokratik hokimiyatning yagona manbai **xalq** hisoblanadi."],["E","“Demokratiya” – yunoncha so‘z bo‘lib, “xalq hokimiyati” degan ma’noni anglatadi."],["D","Demokratik siyosiy tartibot","insonning siyosiy va fuqarolik huquqlari e’tirof etilib, hurmat qilinadigan, davlat boshqaruvi ozchilikning ko‘pchilikka bo‘ysunishi tamoyili asosida amalga oshiriladigan va **ozchilikning manfaatlari himoya qilinadigan** siyosiy tartibot."],["D","Nodemokratik tartibot","demokratiyaga zid tartibot. Bunday tartibotda davlat idoralari demokratik tamoyillar va qoidalarga rioya etmaydilar. Aksincha, ularni doimo yoki tez-tez buzadilar. Fuqarolarning huquq va erkinliklari poymol etiladi, qo‘pol ravishda buziladi, ba’zan juda shafqatsizlik bilan muxolifot bartaraf etiladi. Ba’zida esa parlament singari demokratik institutlar yo‘q qilinadi."],["D","Fashistik tartibot","hukmronlik qilgan har qanday muxolifot yo‘q qilinadi. Biron-bir irqning hukmronligi e’lon qilinadi. Va nihoyat, boshqa hududlarni bosib olishga harakat kuchayadi. **1933–1945-yillardagi fashistlar Germaniyasi** va o‘sha davrdagi **fashistlar Italiyasi** fashistik tartibotli davlatlarga misol bo‘la oladi."],["D","Totalitar tartibot","**yagona partiyaning hukmronligi**, huquq va erkinliklarning poymol etilishi kabi salbiy xususiyatlarga ega bo‘lgan tartibot. Totalitar tartibotda o‘zgacha fikrlarga qarshi kurashiladi, saylovchilarning saylovda muqobil deputatlarni saylash imkoniyatlari bo‘lmaydi."],["D","Davlat organi","qonunga muvofiq ravishda o‘z tizimiga, ijtimoiy hayotning muayyan sohasini boshqarish bo‘yicha aniq belgilangan vakolatiga ega bo‘lgan davlat idorasi yoki muassasasi."],["S","Davlat organlari 4 turga bo‘linadi"],["grid",[["Vakillik organlari",["qonun chiqaruvchi organ","mahalliy xalq deputatlari kengashlari"]],["Ijroiya organlari",["davlat boshlig‘i (prezident, monarx)","hukumat, vazirlik va davlat qo‘mitalari","huquqni muhofaza qiluvchi idoralar (prokuratura, ichki ishlar vazirligi va uning organlari, adliya vazirligi va boshqalar)"]],["Mahalliy ijroiya organlari",["viloyat, tuman va shahar hokimliklari"]],["Sud va konstitutsiyaviy nazorat idoralari",["Konstitutsiyaviy sud","Oliy sud va uning viloyat (shahar) bo‘g‘inlari"]]]],["D","Davlat mexanizmi","jamiyatni boshqarish va xalq manfaatlarini himoya qilishni amalga oshiradigan **davlat organlarining yaxlit tizimi**."],["forms"],["Q","“Xalq davlat organlariga emas, davlat organlari xalqqa xizmat qilishi kerak” degan prinsip barcha bo‘g‘indagi rahbarlar faoliyatida asosiy qoidaga aylanishi kerak.","Shavkat Mirziyoyev"],["Q","Adolat – oxiratda najot, dunyoda saodat boshi.","Ali ibn Abu Tolib"]]},{"n":9,"title":"Fuqarolik jamiyati","blocks":[["D","Forobiy fikri","Abu Nasr Forobiy “Fozil odamlar shahri” asarida Aflotun fikriga tayanib shunday deydi: eng mushkul ish qonunni joriy qilishdir. Qonunga shubha bilan qarash hamda qonun ustidan arz qilish esa eng oson ishdir. **Xalq qonunlarga ehtiyoj sezishi va ularni o‘rganishi zarur**, chunki ular keyinchalik xalqning o‘ziga foyda keltiradi."],["S","Adolatli jamiyatning asosiy yo‘llari (Forobiy bo‘yicha)"],["L",["Fozil (12 xislatni o‘zida aks ettirgan) davlat rahbari va davlat a’zolarining bo‘lishi","Qonun-qoidalarning mavjudligi va ularga davlat rahbarlarining va barcha aholining bo‘ysunishi","Ilm-fanning taraqqiy etishi","Insonlarda yaxshi axloq va xulqning shakllanganligi","Davlat urush va bosqinchiliklarga qarshi bo‘lmog‘i, mamlakatda tinchlik, barqarorlikning o‘rnatilishi"]],["S","Fuqarolik jamiyatining asosiy belgilari"],["N",["turli mulkchilik shakllarining mavjudligi","erkin mehnat qilish va kasb tanlash imkoniyati","tadbirkorlikka keng imkoniyatlar yaratilganligi","siyosiy erkinliklarning mavjudligi","fikrlar xilma-xilligi va axborot erkinligining mavjudligi","inson huquq va erkinliklarining kafolatlanganligi","o‘zini-o‘zi boshqarish organlarining rivojlanganligi","barcha mulkchilik shakllariga bir xilda munosabatda bo‘linishi, ya’ni mulkchilik shakllarining qonun doirasida tengligi","adolatli huquqiy hokimiyatning mavjudligi","huquq ustuvorligining ta’minlanganligi"]],["D","Fuqarolik jamiyati","**komil fuqarolardan**, ya’ni uzviy bog‘liqlikda bo‘lgan hamda axloqiy, huquqiy va siyosiy madaniyatga ega odamlardan iborat jamiyat."],["S","Fuqarolik jamiyatining xususiyatlari 3 ta sohada namoyon bo‘ladi"],["grid",[["Iqtisodiy sohada",["nodavlat notijorat tashkilotlarning, shirkatlarning, aksiyadorlik kompaniyalarining, korporatsiyalarning, firmalarning mavjudligi va ularning muvaffaqiyatli faoliyat ko‘rsatishlari uchun barcha sharoitlarning yaratilganligi"]],["Ijtimoiy-siyosiy sohada",["fuqarolar, oilalar, siyosiy partiyalar, jamoat tashkilotlari, ijtimoiy harakatlar, o‘zini-o‘zi boshqarish organlari, nodavlat ommaviy axborot vositalari, ijtimoiy qarama-qarshiliklarni qonun doirasida yechish imkoniyatlari, aholi fikrini o‘rganish, shakllantirish va ifoda etish uchun shart-sharoitlarning mavjudligi"]],["Ma’naviy sohada",["so‘z va fikr erkinligi, vijdon erkinligi, ijodiy uyushmalarning mustaqilligi, ilmiy uyushmalarning mustaqilligi, ma’naviy tahdidlardan himoyalanganlikning ta’minlanganligi"]]]],["S","O‘zbekistonda fuqarolik jamiyatining turlari"],["N",["Siyosiy partiyalar va ijtimoiy-siyosiy harakatlar","Jamoat tuzilmalari","Nodavlat notijorat tashkilotlar","Ta’lim-tarbiya muassasalari","Diniy tashkilotlar","Milliy-madaniy markazlar","Jamoatchilik fikrini o‘rganish tashkilotlari","Oila hamda uning manfaatlarini aks ettiruvchi maxsus tashkilotlar","Fuqarolarning o‘zini-o‘zi boshqarish organlari","Ommaviy axborot vositalari","Demokratik saylov tizimi"]],["P","Bugungi kunga kelib mamlakatimizda fuqarolik institutlarining roli va ahamiyatini kuchaytirishga, fuqarolarning eng muhim ijtimoiy-iqtisodiy muammolarini hal etishga qaratilgan qonun hujjatlari qabul qilingani va qilinayotgani, minglab nodavlat notijorat tashkilotlarning faoliyat ko‘rsatib kelayotgani, jumladan, siyosiy partiyalar, kasaba uyushmalari, O‘zbekiston xotin-qizlar qo‘mitasi, “Sog‘lom avlod uchun”, “Nuroniy” jamg‘armalari, “Ijod” fondi, O‘zbekiston yoshlar ittifoqining faoliyati mamlakatimizda fuqarolik jamiyati rivojlanayotganligining yaqqol isbotidir. **2018-yil 1-iyul** holatiga ko‘ra, mamlakatimizda Adliya vazirligining ro‘yxatidan o‘tgan fuqarolik jamiyati institutlari soni **9.478 tani** tashkil etadi."],["P","O‘zbekistonda fuqarolarning o‘zini-o‘zi boshqarish tuzilmalari mavjud bo‘lib, bunda **mahalla** alohida ahamiyatga ega."],["K","ESLAB QOLING","**Huquqning ustuvorligi** O‘zbekistonda fuqarolik jamiyatini rivojlantirishning muhim elementidir."],["S","Fuqarolik jamiyatining taraqqiy topishi asosiy yo‘nalishlari"],["N",["Mulkni davlat tasarrufidan chiqarish","Ko‘ppartiyaviylik tizimini rivojlantirish","Ishlab chiqarishni yuksaltirish","Maqbul ijtimoiy dasturlar ishlab chiqish"]]]},{"n":10,"title":"Huquqiy davlat","blocks":[["P","Davlatning huquqqa bo‘lgan munosabatiga qarab quyidagi turlarga ajratish mumkin: **etatik** va **huquqiy davlat**."],["S","Etatik davlat belgilari"],["N",["Qonun o‘rnini ko‘pincha qat’iy buyruq va farmoyishlar egallaydi","Davlat o‘z fuqarolari siyosiy birlashmalari va tashkilotlarining erkinliklarini qat’iy cheklab qo‘yadi","Davlat iqtisodiy-ijtimoiy munosabatlarni va hatto fuqarolarning shaxsiy hayotini ham o‘z boshqaruvi ta’siriga olishga intiladi","Davlat organlari va mansabdor shaxslariga haddan tashqari ko‘p vakolatlar beriladi"]],["D","Etatik davlatga misollar","**Kuba**, **sobiq Sovet Ittifoqi**."],["P","Huquqiy davlatda davlat boshqaruvi **huquqning ustuvorligiga** asoslanadi. Bunda davlat boshqaruvi fuqarolar va ijtimoiy munosabatlar subyektlarining huquqlari, erkinliklari va manfaatlarini ta’minlashni hisobga olgan holda amalga oshiriladi."],["D","Huquqiy davlat","huquqning ustuvorligi hamda **sud mustaqilligi** ta’minlanadigan, inson huquqlari va erkinliklari kafolatlanadigan, davlat hokimiyati vakolatlar **bo‘linishi tamoyili** asosida amalga oshiriladigan demokratik davlatdir."],["S","Huquqiy davlatning asosiy belgilari"],["chips",["Huquqning ustuvorligi","Inson huquqlari va erkinliklarining ta’minlanishi va himoyalanishi","Davlat va fuqaroning bir-birlari oldida o‘zaro mas’uliyati","Hokimiyatning qonuniyligi","Hokimiyat vakolatlarining taqsimlanishi","Sudning mustaqilligi","Huquqni muhofaza qilish mexanizmining samarali ishlashi","Yuqori darajadagi huquqiy madaniyat","Demokratiyaning rivojlanganligi va takomillashganligi"],3],["Q","Bizning faoliyatimiz eng muhim konstitutsiyaviy qoidaga – ijtimoiy adolat tamoyilining ta’minlanishiga qaratilishi shart. Jamiyatda ijtimoiy adolat ta’minlanishini qaror topdirish borasidagi asosiy vazifamiz – bu adolatli qonunlar qabul qilishdan iborat.","Shavkat Mirziyoyev"],["Q","Bizning maqsadimiz – xalq hokimiyatini so‘zda emas, amalda ta’minlashdan iborat. Bu – biz yashayotgan bugungi murakkab davrning asosiy talabidir.","Shavkat Mirziyoyev"]]},{"n":11,"title":"O‘zbekiston Respublikasida davlat boshqaruvi","blocks":[["P","O‘zbekiston Respublikasida “**xalq – hokimiyatning birdan bir manbai**” ekanligi konstitutsiyada belgilab qo‘yilgan."],["P","O‘zbekiston suverenitetining huquqiy asosi – Asosiy qonuni **O‘zbekiston Respublikasining Konstitutsiyasi** bo‘lib, ushbu hujjat O‘zbekiston Respublikasi Oliy Kengashining o‘n ikkinchi chaqiriq XI sessiyasida, **1992-yil 8-dekabrda** qabul qilingan."],["P","O‘zbekiston xalqi nomidan faqat u saylagan respublika **Oliy Majlisi** va **Prezidenti** ish olib borishi mumkin. Davlat o‘z faoliyatini inson va jamiyat farovonligini ko‘zlab, ijtimoiy adolat va qonuniylik prinsiplari asosida amalga oshiradi."],["P","O‘zbekiston Respublikasi davlat hokimiyatining tizimi hokimiyatning **qonun chiqaruvchi, ijro etuvchi va sud hokimiyatiga bo‘linishi** prinsipiga asoslanadi."],["power"],["P","O‘zbekiston Respublikasida sud hokimiyati qonun chiqaruvchi va ijro etuvchi hokimiyatlardan, siyosiy partiyalardan, boshqa jamoat birlashmalaridan **mustaqil holda** ish yuritadi."],["P","O‘zbekiston Respublikasi **Vazirlar Mahkamasi** ijro etuvchi hokimiyatni amalga oshiradi. Vazirlar Mahkamasi o‘z faoliyatida O‘zbekiston Respublikasi Prezidenti va O‘zbekiston Respublikasi Oliy Majlisi oldida javobgardir."]]},{"n":12,"title":"O‘zbekiston Respublikasi Prezidenti","blocks":[["P","Bizning mamlakatimizda Prezident **davlat boshlig‘i** hisoblanadi. Prezident xalqimiz tomonidan to‘g‘ridan-to‘g‘ri saylangani uchun davlat nomidan, xalq nomidan ish yuritish Prezidentimizning birlamchi vakolati hisoblanadi."],["E","Prezident – so‘zi lotin tilidan olingan bo‘lib, uning lug‘aviy ma’nosi “oldinda o‘tiruvchi” demakdir."],["P","O‘zbekiston Respublikasining Prezidenti O‘zbekiston Respublikasining fuqarolari tomonidan **umumiy, teng va to‘g‘ridan-to‘g‘ri** saylov huquqi asosida yashirin ovoz berish yo‘li bilan **yetti yil** muddatga saylanadi. Prezidentni saylash tartibi O‘zbekiston Respublikasining qonuni bilan belgilanadi. O‘zbekiston Respublikasining Prezidenti davlat hokimiyati organlarining kelishilgan holda faoliyat yuritishini hamda hamkorligini ta’minlaydi. Prezident O‘zbekiston Respublikasi Oliy Majlisi yig‘ilishida **qasamyod** qabul qilgan paytdan boshlab o‘z lavozimiga kirishgan hisoblanadi."],["S","Prezident lavozimiga nomzodlarga qo‘yiladigan talablar"],["chips",["35 yoshdan kichik bo‘lmasligi kerak","Davlat tilini yaxshi bilishi zarur","Saylovgacha kamida 10 yil O‘zbekiston hududida muqim yashayotgan bo‘lishi kerak","O‘zbekiston fuqarosi bo‘lishi zarur"],4],["Q","O‘zbekiston xalqiga sadoqat bilan xizmat qilishga, respublikaning Konstitutsiyasi va qonunlariga qat’iy rioya etishga, fuqarolarning huquqlari va erkinliklariga kafolat berishga, O‘zbekiston Respublikasi Prezidenti zimmasiga yuklatilgan vazifalarni vijdonan bajarishga tantanali qasamyod qilaman.","Prezident qasamyodi"],["P","O‘zbekiston Respublikasining Prezidenti Konstitutsiyaga va qonunlarga asoslanib hamda ularni ijro etish yuzasidan respublikaning butun hududida majburiy kuchga ega bo‘lgan **farmonlar, qarorlar va farmoyishlar** chiqaradi."],["K","ESLAB QOLING","Prezident **qonun chiqarmaydi.**"],["P","Vakolati tugashi munosabati bilan iste’foga chiqqan Prezident **umrbod Senat a’zosi** lavozimini egallaydi."],["P","Prezident O‘zbekiston Respublikasi **Qurolli Kuchlarining Oliy Bosh Qo‘mondoni** hisoblanadi. U Qurolli Kuchlarning oliy qo‘mondonlarini vazifasiga tayinlaydi va vazifasidan ozod qiladi, harbiy unvonlar beradi."],["P","Prezident o‘z vazifasini bajarib turgan davrda boshqa haq to‘lanadigan lavozimni egallashi, vakillik organining deputati bo‘lishi, tadbirkorlik faoliyati bilan shug‘ullanishi **mumkin emas.**"],["S","O‘zbekiston Respublikasi Prezidentining vakolatlari"],["N",["fuqarolar huquq va erkinliklari ta’minlanishi hamda O‘zbekiston Respublikasi qonunchiligining kafilidir","mamlakat mustaqilligi va xavfsizligini ta’minlash bo‘yicha choralar ko‘radi","O‘zbekiston Respublikasi nomidan mamlakat ichkarisida va xalqaro miqyosda muzokaralar yuritadi, shartnoma va kelishuvlar imzolaydi hamda ularning bajarilishini ta’minlaydi","Bosh vazir nomzodini Oliy Majlisga tasdiqlash uchun taqdim qiladi, Vazirlar Mahkamasi tarkibini tasdiqlaydi","Bosh prokuror va uning o‘rinbosarlarini lavozimga qo‘yadi va lavozimdan bo‘shatadi","Oliy Majlis Senatiga Konstitutsiyaviy, Oliy sudlar raislari, ularning o‘rinbosarlari, Markaziy bank raisi nomzodlarini taqdim qiladi","O‘zbekiston Respublikasi fuqaroligiga qabul qilish va undan chiqarish masalalarini hal qiladi","Davlat mukofotlari va faxriy unvonlar bilan mukofotlaydi","Konstitutsiya va qonunlarda belgilangan bir qator muhim vakolatlarni amalga oshiradi"]],["D","Favqulodda vaziyat","Prezident zarur paytlarda butun mamlakat bo‘yicha yoki ayrim hududlarda **favqulodda vaziyat yoki urush holatini** joriy qilish huquqiga ham ega. Bunda **uch kun muhlat** ichida bunday yechim Oliy Majlisga tasdiqlash uchun taqdim qilinadi."],["Q","Qudratimizga shak-shubhangiz bo‘lsa, biz qurgan binolarga boqing.","Amir Temur"]]},{"n":13,"title":"O‘zbekiston Respublikasida qonun chiqaruvchi organ","blocks":[["P","Qonun chiqaruvchi hokimiyatni amalga oshiruvchi **Oliy Majlis** ikki palatali tarzda – **Qonunchilik palatasi** va **Senatdan** iborat."],["P","O‘zbekiston Respublikasining Oliy Majlisi oliy davlat vakillik organi bo‘lib, qonun chiqaruvchi hokimiyatni amalga oshiradi. O‘zbekiston Respublikasi Oliy Majlisi ikki palatadan – Qonunchilik palatasi (**quyi palata**) va Senatdan (**yuqori palata**) iborat. Oliy Majlisning Qonunchilik palatasi va Senati vakolat muddati – **besh yil**. Bu palatalarning tarkibi ular oldiga qo‘yilgan maqsad va vazifalarga mos ravishda shakllantirilishi qonun yo‘li bilan belgilab qo‘yilgan."],["P","Senatning hududlar manfaatlarini ifoda etishini inobatga olgan holda uning tarkibi asosan xalq deputatlari mahalliy Kengashlari vakillaridan tashkil topadi. Senat boshqacha nom bilan parlamentning yuqori palatasi deb ham yuritiladi."],["P","Qonunchilik palatasi o‘z faoliyatini **doimiy professional asosda** amalga oshiradi va uning tarkibi asosan qonun va boshqa huquqiy hujjatlar yaratish uchun zarur bilim, tajriba va malakaga ega yuqori saviyadagi mutaxassislardan iborat bo‘ladi. Qonunchilik palatasi boshqa nom bilan parlamentning quyi palatasi deb ham yuritiladi."],["T",["","Qonunchilik palatasi","Senat"],[["A’zolar soni","150 nafar a’zodan iborat","65 nafar a’zodan iborat"],["Shakllanishi","75 nafar deputat saylov orqali bevosita xalq tomonidan saylanadi.","Senat a’zolari Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesi, viloyatlar, tumanlar va shaharlar davlat hokimiyati vakillik organlari deputatlarining qo‘shma majlislarida yashirin ovoz berish yo‘li bilan Qoraqalpog‘iston Respublikasi, viloyatlar va Toshkent shahridan teng miqdorda – to‘rt kishidan saylanadi. To‘qqiz nafar a’zosi fan, san’at, adabiyot, alohida xizmat ko‘rsatgan eng obro‘li fuqarolar orasidan Prezident tomonidan tayinlanadi."],["Rahbari","Spiker (Qonunchilik palatasi o‘z tarkibidan saylaydi)","Senat Raisi (Prezidentning taqdimiga binoan saylanadi)"]],[0.7,1.5,2.2]],["P","Saylov kuni **yigirma besh yoshga** to‘lgan hamda kamida **besh yil** O‘zbekiston hududida muqim yashayotgan O‘zbekiston fuqarosi Qonunchilik palatasi deputati, shuningdek, Senat a’zosi bo‘lishi mumkin. Deputatlikka nomzodlarga qo‘yiladigan talablar qonun bilan belgilanadi. Bitta shaxs bir paytning o‘zida Qonunchilik palatasi deputati va Senat a’zosi bo‘lishi **mumkin emas.**"],["P","Oliy Majlisning Qonunchilik palatasi o‘z tarkibidan Qonunchilik palatasining **Spikeri** va uning o‘rinbosarlarini saylaydi. Senat o‘z tarkibidan **Senat Raisi** va uning o‘rinbosarlarini saylaydi. Senat Raisi Prezidentning taqdimiga binoan saylanadi."],["D","Daxlsizlik huquqi","Qonunchilik palatasi deputati va Senat a’zosi daxlsizlik huquqidan foydalanadilar. Ular Qonunchilik palatasi yoki Senatning roziligisiz **jinoiy javobgarlikka tortilishi, ushlab turilishi, qamoqqa olinishi** yoki sud tartibida beriladigan ma’muriy jazo choralariga tortilishi mumkin emas."],["P","Oliy Majlis ishining tashkiliy shakli – bu **sessiyadir**. Oliy Majlis sessiyasining asosini uning majlislari tashkil qiladi. Sessiya majlislari oralig‘ida Oliy Majlis qo‘mitalari, komissiyalari va boshqa organlari majlislari o‘tkaziladi. Oliy Majlis sessiyasi bir yilda **ikki martadan kam bo‘lmagan** tarzda chaqiriladi. Oliy Majlis deputatlari qonunchilik asosida fraksiyalarga, bloklarga boshqa deputatlik guruhlariga birlashishlari, Oliy Majlisga taqdim qilinayotgan masalalarni oldindan muhokama qilishlari va takliflar kiritishlari mumkin."],["S","Oliy Majlis quyidagi ishlarni amalga oshiradi"],["L",["O‘zbekiston Respublikasi Prezidenti farmonlarini tasdiqlash","Konstitutsiyaviy, Oliy sudlarni saylash","Markaziy bank raisini saylash","O‘zbekiston Respublikasi qonunlarini ko‘rib chiqish va qabul qilish","O‘zbekiston Respublikasi davlat budjetini va davlatning boshqa strategik dasturlarini qabul qilish"]],["P","Qonunlar Oliy Majlisga **qonunchilik tashabbusi huquqiga** ega bo‘lgan organlar tomonidan taqdim qilinadi. Shundan so‘ng Oliy Majlis bu qonunlarni ko‘rib chiqadi, tuzatishlar kiritadi va qabul qiladi."]]},{"n":14,"title":"O‘zbekiston Respublikasining ijro etuvchi hokimiyat organlari","blocks":[["P","O‘zbekiston Respublikasining hukumati boshchiligida ijro etuvchi hokimiyatning yagona tizimi amal qiladi. Mazkur tizimga quyidagilar kiradi:"],["N",["Vazirlar Mahkamasi","vazirliklar","davlat qo‘mitalari","boshqaruv funksiyasini amalga oshiruvchi agentliklar, konsern va uyushmalar","viloyat, tuman va shahar hokimliklari"]],["P","Konstitutsiyaga muvofiq O‘zbekistonda ijro etuvchi hokimiyatni **Vazirlar Mahkamasi** amalga oshiradi."],["S","Bosh vazir haqida"],["P","Vazirlar Mahkamasining tarkibi Bosh vazir taqdim etgan nomzodlar ichidan tanlab olinadi va Prezident tomonidan tasdiqlanadi. Bosh vazir nomzodi Prezidentning taqdimiga binoan Oliy Majlisning **Qonunchilik palatasi** tomonidan ko‘rib chiqiladi va tasdiqlanadi. Vazirlar Mahkamasining a’zolari Bosh vazir taqdimiga binoan Prezident tomonidan tasdiqlanadi."],["S","Bosh vazir:"],["N",["Vazirlar Mahkamasi faoliyatini tashkil etadi va unga rahbarlik qiladi, uning samarali ishlashi uchun shaxsan javobgar bo‘ladi","Vazirlar Mahkamasining majlislarida raislik qiladi, uning qarorlarini imzolaydi","xalqaro munosabatlarda Vazirlar Mahkamasi nomidan ish ko‘radi","qonunlarda nazarda tutilgan boshqa vazifalarni bajaradi"]],["S","Vazirlar Mahkamasi tarkibiga quyidagilar kiradi"],["chips",["Bosh vazir","Bosh vazir o‘rinbosarlari","Vazirlar","Qoraqalpog‘iston Respublikasi hukumatining boshlig‘i"],4],["P","Vazirlar Mahkamasi o‘z faoliyatini amalga oshirish jarayonida Prezident va Oliy Majlis oldida **javobgar** hisoblanadi. Vazirlar Mahkamasi iqtisodiyotning, ijtimoiy va ma’naviy sohaning samarali faoliyatiga rahbarlikni, qonunlar, Oliy Majlis palatalari qarorlari, Prezidentning farmonlari, qarorlari va farmoyishlarining ijrosini ta’minlaydi."],["K","ESLAB QOLING","Oliy Majlis yangi saylanishi bilan Vazirlar Mahkamasi **to‘laligicha iste’foga chiqadi.**"],["S","Vazirlar Mahkamasi yana quyidagi vazifalarni bajaradi"],["N",["Davlat budjetini ishlab chiqadi va Oliy Majlisga taqdim etadi hamda uning bajarilishini ta’minlaydi","Oliy Majlisga davlat budjetining bajarilishi haqida hisobot beradi","yagona moliya, pul-kredit siyosati yuritilishini ta’minlaydi","madaniyat, fan, maorif, ijtimoiy ta’minot, ekologiya sohasida yagona davlat siyosati yuritilishini ta’minlaydi","mamlakatni mudofaa qilish, davlat xavfsizligi, tashqi siyosatni amalga oshirishni ta’minlash chora-tadbirlarini ko‘radi","qonuniylik, fuqarolarning huquqlari va erkinliklarini ta’minlash, xususiy mulk va jamoat tartibini muhofaza qilish, jinoyatchilikka qarshi kurash bo‘yicha chora-tadbirlarni amalga oshiradi"]],["P","Butun hududda barcha organlar, korxonalar, muassasalar, tashkilotlar, mansabdor shaxslar va fuqarolar uchun bajarilishi shart bo‘lgan **qarorlar va farmoyishlar** chiqaradi. Prezident hukumat majlisida raislik qilish huquqiga ega."],["D","Ibn Sino g‘oyasi","Buyuk mutafakkir Ibn Sino har qanday jamiyat, davlat ma’lum adolatni himoya etuvchi, **qonunlar asosida idora etiladigan**, adolatsizlikka yo‘l qo‘yilmaydigan, qonun ustuvor bo‘lgan adolatli jamiyat ta’limotini yaratishga, uni rivojlantirishga katta hissa qo‘shgan."],["P","Davlat boshqaruvida **vertikal** boshqaruv organlarining vakolatlarini qisqartirish hisobiga **gorizontal** boshqaruv organlarining vakolatlarini kengaytirish davlat boshqaruvi sohasida markazlashtirishni cheklashga imkoniyat yaratadi. Bunda boshqaruv borasidagi vazifalarning bir qismini respublika darajasidan mahalliy (viloyat, tuman, shahar) miqyosiga o‘tkazishning ahamiyati katta bo‘ldi. Ayniqsa, mahalliy o‘zini-o‘zi boshqarishning noyob shakli bo‘lgan **mahalla tizimi** faqatgina O‘zbekistonda amal qilgan o‘ziga xos yangilik bo‘lib davlat boshqaruvi fani va amaliyotiga kirdi."],["Q","Hukumat – so‘zlovchi qonun, qonun esa gung hukumatdir.","Sitseron Mark Tulliy"]]},{"n":15,"title":"O‘zbekiston Respublikasi sud tizimi","blocks":[["P","O‘zbekiston Respublikasida sud hokimiyati qonun chiqaruvchi va ijro etuvchi hokimiyatlardan, siyosiy partiyalardan, boshqa jamoat birlashmalaridan **mustaqil holda** ish yuritadi."],["P","Sudyalar mustaqildirlar, **faqat qonunga bo‘ysunadilar.** Sudyalarning odil sudlovni amalga oshirish borasidagi faoliyatiga biron-bir tarzda aralashishga yo‘l qo‘yilmaydi va bunday aralashish qonunga muvofiq javobgarlikka sabab bo‘ladi. Sudyalarning daxlsizligi qonun bilan kafolatlanadi."],["P","Hamma sudlarda ishlar **ochiq** ko‘riladi. Ishlarni yopiq majlisda tinglashga qonunda belgilangan hollardagina yo‘l qo‘yiladi."],["P","Ayblanuvchi **himoyalanish huquqi** bilan ta’minlanadi. Tergov va sud ishini yuritishning har qanday bosqichida malakali yuridik yordam olish huquqi kafolatlanadi. Fuqarolarga, korxona, muassasa va tashkilotlarga yuridik yordam berish uchun **advokatura** faoliyat ko‘rsatadi. Advokatura tashkil etish va uning ish tartibi qonun bilan belgilanadi."],["D","Sud hokimiyati","davlat hokimiyatining bir bo‘g‘ini. Sud idoralaridan boshqa davlat idorasi fuqarolik, jinoyat va boshqa ishlarni ko‘rish, hal etish huquqiga ega emas. Sud hokimiyati **odil sudlovni amalga oshirish vakolatiga** ega bo‘lgan yagona hokimiyatdir."],["S","O‘zbekiston Respublikasining sud tizimi"],["N",["O‘zbekiston Respublikasi Konstitutsiyaviy sudi","O‘zbekiston Respublikasi Oliy sudi","Harbiy sudlar","Qoraqalpog‘iston Respublikasining fuqarolik va jinoyat ishlari bo‘yicha sudlari","Fuqarolik va jinoyat ishlari bo‘yicha viloyat va Toshkent shahar sudlari","Fuqarolik ishlari bo‘yicha tumanlararo, tuman (shahar) sudlari, jinoyat ishlari bo‘yicha tuman (shahar) sudlari","Qoraqalpog‘iston Respublikasining, viloyatlar va Toshkent shahar iqtisodiy va ma’muriy sudlari","Tumanlararo, tuman, shahar iqtisodiy sudlari","Tuman, shahar ma’muriy sudlari"]],["P","Davlat o‘z zimmasiga sudlov organlari o‘z vazifalarini samarali bajarishlari uchun zarur sharoitlarni yaratib berish majburiyatini olgan. Sud idoralarining mustaqilligi davlat tomonidan kafolatlanishi, Konstitutsiya va qonunlarda belgilab qo‘yilishi BMT tomonidan qabul qilingan “Sud idoralarining mustaqilligiga oid asosiy tamoyillar” nomli xalqaro huquqiy hujjatda ham o‘z ifodasini topgan."],["D","Konstitutsiyaviy sud","qonun chiqaruvchi va ijro etuvchi hokimiyatlarning **hujjatlari Konstitutsiyaga qanchalik mosligiga** doir ishlarni ko‘radi."],["D","Oshkoralik tamoyili","odil sudlov faoliyatining huquqiy asosini belgilab beradigan muhim konstitutsiyaviy tamoyillardan biri. Sud tizimiga kiruvchi barcha sudlarda ishlar **ochiq** ko‘riladi."],["D","Aybsizlik prezumpsiyasi","sud tizimining xalqaro andozalarga mos ekanligini tasdiqlovchi jihatlaridan biri. Bu milliy huquqiy tizimning jiddiy yutug‘i va fuqarolik jamiyatining muhim tamoyillaridan hisoblanadi."],["P","Mamlakatimizda barcha sudyalar **bir xil maqomga** ega. Sudyalarning odil sudlovni amalga oshirish borasidagi faoliyatiga aralashishga yo‘l qo‘yilmaydi."],["Q","Agar sud hokimiyati ijro hokimiyati bilan birlashsa, u holda sud hakami sitamgarga aylanishiga imkoniyat tug‘iladi.","Monteskiyo"],["P","**Amir Temur davlatida** odil sudlovni amalga oshirish uchun mukammal tizimdagi sud tizimi mavjud bo‘lib, ular quyidagi to‘rt sohaga bo‘lingan va **qozilar** tomonidan boshqarilgan:"],["N",["Fuqarolik sudi (aholi qozisi)","Harbiy sud (lashkar qozisi)","Shariat sudi (islom qozisi)","Amaldorlar sudi (xizmatchilar qozisi)"]],["P","Shahar, o‘lka va viloyat aholisi jinoyat va fuqarolar ishi bo‘yicha sud qilinardi. Bu ishda shariat, harbiy kishilarga nisbatan harbiy sud (tribunal) qo‘llanilsa-da, tuzuklar asosida hukm chiqarilgan. Taxt vorislari uchun hukmni amirning o‘zi chiqarardi."],["Q","Jamiyatda huquqiy ong va huquqiy madaniyatni yuksaltirib borish qonun ustuvorligini ta’minlash va qonuniylikni mustahkamlashning eng muhim shartlaridan biri hisoblanadi.","Shavkat Mirziyoyev"]]},{"n":16,"title":"Axloq va huquq","blocks":[["P","Kishining jamiyatdagi xulq-atvorini tartibga soluvchi qoidalar tizimi axloq hisoblanadi. O‘zbekiston hududida ming yillar davomida shakllangan **milliy axloq normalari** milliy huquq tizimimizning shakllanishida hal qiluvchi ahamiyat kasb etgan."],["D","Axloq","kishining jamiyatdagi xulq-atvorini tartibga soluvchi **talab va qoidalar yig‘indisi**."],["P","Huquq albatta davlat irodasini ifodalaydi. Huquqiy davlatda davlatning irodasi jamiyat, xalq irodasi bilan mos tushganligi sababli bunday davlatda huquq jamiyat yoki xalq irodasini ifodalaydi deb ta’kidlash mumkin. Huquqqa oid normalar va qoidalarda bayon etilgan talablar jamiyatning barcha a’zolari tomonidan bajarilishi majburiydir. Ya’ni huquqqa oid normalar va xulq-atvor qoidalari **umummajburiydir.**"],["D","Huquq","**davlat tomonidan o‘rnatilgan** va u tomonidan himoya qilinadigan barcha uchun majburiy bo‘lgan xulq-atvor qoidalarining tizimi."],["P","“Huquq” atamasi ikki — obyektiv hamda subyektiv huquq ma’nosida qo‘llaniladi."],["D","Obyektiv huquq","huquq normalarining **yig‘indisi**."],["D","Subyektiv huquq","ma’lum bir shaxs yoki guruhga tegishli bo‘lgan huquq. Misol uchun kimningdir uy-joyga bo‘lgan yoki biror-bir mulkka nisbatan bo‘lgan huquqi. **Subyektiv huquq obyektiv huquqsiz mavjud bo‘lmaydi.**"],["P","Huquqning o‘zi esa davlat bilan uzviy bog‘liqdir. Ular bir-birisiz mavjud bo‘lishi mumkin emas."],["S","Huquqning vazifalari: tartibga solish, qo‘riqlash va tarbiyalash"],["T",["Vazifa","Mazmuni"],[["Tartibga solish","Jamiyatdagi ijtimoiy munosabatlarni va alohida shaxs xulq-atvorini kerakli yo‘nalishga solish."],["Qo‘riqlash","Huquqiy muhofaza va yuridik mas’uliyat choralarini, ularni qo‘llash tartibini o‘rnatish."],["Tarbiyalash","Turmushda nimalarni qilish mumkin, nimalar taqiqlanadi. Har xil vaziyatlarda qanday harakat qilish lozimligini belgilashdan iborat. Zarur bo‘lganda majburlash uslubini, hatto jazolashni ham nazarda tutadi."]],[1,4]],["S","Huquq va axloqning farqlari"],["T",["HUQUQ","AXLOQ"],[["davlat tomonidan belgilangan bo‘ladi","ezgulik va yovuzlik, adolat va nohaqlik kabilar davlatning yordamisiz o‘z-o‘zidan shakllanadi"],["davlat irodasini aks ettiradi","jamiyat a’zolarining fikri, dunyoqarashi hamda insoniy fazilat va tushunchalarini aks ettiradi"],["normalari, zarur hollarda, davlatning majburlov kuchi orqali qaror topadi","normalari jamoatchilik fikri orqali qaror topadi"],["muayyan ijtimoiy munosabatlarni tartibga soladi","ijtimoiy munosabatlarning kengroq doirasini (do‘stlik, o‘rtoqlik va hatto muhabbatni ham) tartibga soladi"],["xatti-harakat yoki harakatsizlik “qonuniy–noqonuniy” deb baholanadi","xatti-harakat “yaxshi–yomon” deya baholanadi"],["hujjatlarda aniq ko‘rinishga ega","hujjatlarda aniq ko‘rinishga ega emas"]],[1,1]]]},{"n":17,"title":"Huquq normalari","blocks":[["D","Huquq normasi","huquq tizimining eng asosiy, dastlabki elementi. Jamiyatning ijtimoiy, iqtisodiy, siyosiy tuzilishi bilan belgilanadigan, davlat tomonidan o‘rnatilgan, bajarilishi jamiyatning barcha a’zolari uchun **umummajburiy** bo‘lgan, ijtimoiy munosabatlarni tartibga soluvchi qoidalardir."],["D","Huquq normasi (qisqacha)","davlat tomonidan belgilanadigan, kafolatlanadigan va muhofaza qilinadigan **barcha uchun majburiy xulq-atvor qoidasi**."],["P","Huquq normasining asosiy vazifasi – **ijtimoiy munosabatlarni tartibga solish.** Huquq alohida normalar, xulq-atvor qoidalaridan tashkil topgan."],["P","Huquqiy norma tuzilishiga ko‘ra bir-biri bilan bog‘liq bo‘lgan quyidagi uch tarkibiy qism (element)dan: **gipoteza, dispozitsiya, sanksiyalardan** tashkil topishi mumkin."],["T",["Element","Mazmuni","So‘z ma’nosi"],[["Gipoteza","Norma harakatga kelishi uchun zarur bo‘lgan shart-sharoitlar bayon etiladi.","yunoncha – faraz qilish, fikr yuritish"],["Dispozitsiya","Xulq-atvor qoidalarining o‘zi ifodalanib, huquq subyektlarining huquq va majburiyatlari belgilab beriladi.","lotincha – bayon qilish"],["Sanksiya","Huquq normalari bajarilmagani uchun davlat tomonidan qo‘llaniladigan majburlov chorasi bayon etiladi.","lotincha – majburiy chora"]],[1,2.6,1.6]],["E","“Norma” so‘zi lotinchadan tarjima qilinganda “qoida”, “namuna” ma’nosini anglatadi."],["P","Ayrim qonun hujjatlarida huquq normasi bu uch tarkibiy elementdan emas, balki **2 ta** tarkibiy elementdan tashkil topgan bo‘lishi ham mumkin. Masalan, har qanday mamlakat Konstitutsiyasidagi moddalar asosan gipoteza va dispozitsiyadan iborat bo‘lib, sanksiya elementi deyarli ko‘zda tutilmagan. O‘zbekiston Respublikasi Konstitutsiyasining **6-moddasini** oladigan bo‘lsak, u yerda “O‘zbekiston Respublikasining poytaxti – Toshkent shahri” deb e’tirof etilgan. Bu modda huquq normasiga misol bo‘la oladi va bu modda faqatgina **dispozitsiyadan** iborat."],["S","Huquq normasining belgilari"],["N",["davlatning (xalqning) irodasini aks ettiradi","davlat tomonidan normativ hujjatlarda aks ettiriladi","davlat tomonidan muhofaza qilinadi, zarur bo‘lgan hollarda davlatning majburlov kuchi bilan ta’minlanadi","jamiyat va davlat nuqtai nazaridan eng muhim bo‘lgan ijtimoiy munosabatlarni mustahkamlaydi"]],["S","O‘zbekiston ratifikatsiya qilgan ba’zi xalqaro hujjatlar"],["L",["Inson huquqlari umumjahon deklaratsiyasi","Bola huquqlari to‘g‘risidagi konvensiya","Iqtisodiy, ijtimoiy va madaniy huquqlar to‘g‘risidagi xalqaro pakt","Fuqarolik va siyosiy huquqlar to‘g‘risidagi xalqaro pakt","Texnik va kasb ta’limi bo‘yicha konvensiya","Rivojlanish huquqi to‘g‘risidagi deklaratsiya","Xalqaro madaniy hamkorlik tamoyillari to‘g‘risidagi deklaratsiya","Ishga qabul qilishning minimal yoshi to‘g‘risidagi konvensiya"]],["Q","Ozod bo‘lish uchun qonunlarning quliga aylanishga to‘g‘ri keladi.","Sitseron Mark Tulliy"]]},{"n":18,"title":"Huquq sohalari","blocks":[["D","Huquq tizimi","jamiyatdagi mavjud huquq normalarining **bir butun voqelik** sifatida harakatlanishi, huquq normalari va sohalarini muayyan izchillikda, o‘zaro uzviy aloqadorlikda joylanishi."],["P","Qaysi huquq normasini qaysi obyektga nisbatan ishlatish lozimligini aniqlashtirish uchun ularni turlarga ajratish lozim. Huquq tizimi, avvalambor, **huquq tarmoqlari (sohalari)** deb nomlanuvchi alohida tarmoqlarga ajratiladi. Bunda, davlatdagi ijtimoiy munosabatlarning xilma-xilligi e’tiborga olinadi. Aynan shu munosabatlar huquqiy tartibga solish (boshqaruv)ning predmetini tashkil qiladi. Huquqiy tartibga solish usuli esa, huquqning ijtimoiy munosabatlarga ta’sir ko‘rsatishga yordamlashadigan yo‘llari, usullari, vositalarining yig‘indisidir."],["S","O‘zbekiston Respublikasi huquq tizimi"],["T",["Moddiy huquq tarmoqlari","Protsessual huquq tarmoqlari","Xalqaro huquq tizimi tarmoqlari"],[["konstitutsiyaviy, fuqarolik, ma’muriy, jinoiy, oila, mehnat, yer, suv, agrar, ekologiya, moliya","fuqarolik-protsessual, jinoyat-protsessual, iqtisodiy-protsessual, ma’muriy-protsessual","xalqaro ommaviy huquq, xalqaro xususiy huquq, xalqaro tashkilotlar, xalqaro xavfsizlik huquqi, diplomatik va konsullik huquqi, xalqaro dengiz huquqi va boshqalar"]],[1,1,1]],["P","Birinchi ikki guruh (moddiy va protsessual) mamlakatning **ichki huquq tizimi tarmoqlari**dir."],["D","Huquq institutlari","o‘zaro bog‘langan, bir turdagi ijtimoiy munosabatlarni tartibga soluvchi **huquqiy normalar guruhi.** Konstitutsiyaviy huquq sohasida – prezidentlik, fuqarolarning huquq va erkinliklari instituti; jinoyat huquqi sohasida – javobgarlik instituti; oila huquqida – nikoh instituti va boshqalar. Huquq institutlari birlashib, huquq sohasini tashkil etadi."],["S","Moddiy huquq sohalari nimani tartibga soladi?"],["T",["Huquq sohasi","Tartibga soladigan munosabatlar"],[["Mehnat huquqi","Korxonalar, tashkilotlar va ularning xodimlari o‘rtasidagi mehnat munosabatlari."],["Fuqarolik huquqi","Mulk bilan aloqador hamda nomulkiy munosabatlar."],["Oila huquqi","Oiladagi, oila va nikoh bilan bog‘liq munosabatlar."],["Ekologiya huquqi","Tabiatni muhofaza qilish jarayonida yuzaga keladigan munosabatlar."],["Jinoyat huquqi","Qanday xatti-harakatlar jamiyat uchun xavfli ekanligi belgilanadi, ularni sodir etganlar qanday jazolanishi va bu borada yuzaga keladigan barcha munosabatlar."]],[1.3,4]],["P","**Protsessual huquqlar** sudlarning faoliyatini tartibga soladi va qaysi tarmoqqa oid huquqiy masalalarni ko‘rayotganligiga qarab 3 ta turga bo‘linadi:"],["T",["Protsessual huquq","Nimani tartibga soladi"],[["Fuqarolik-protsessual","Sudlarning fuqarolik, oilaviy, mehnat, yer bilan bog‘liq va moliyaviy munosabatlar kabi bir qator sohalardagi faoliyatini tartibga soladi."],["Iqtisodiy-protsessual","Yer, agrar, moliyaviy, ekologiya sohalariga oid huquqiy munosabatlarni sudlar orqali yechish. Fuqarolik-protsessual huquqda jismoniy shaxslar o‘rtasidagi munosabatlar aks etsa, bunda **xo‘jaliklararo mulkiy nizolarni** hal etish nazarda tutilgan."],["Jinoyat-protsessual","Sudlov, tergov, prokuratura organlarining jinoyat ishlarini tergov qilish va sudda ko‘rib chiqish faoliyatini tartibga soladi."]],[1.3,4]],["P","Yuqorida atalgan tarmoqlar davlatning ichki huquq tizimini tashkil qiladi. Bundan tashqari **xalqaro huquq tizimi** ham mavjud bo‘lib, bu huquq tizimi normalari davlatlar, xalqaro tashkilotlar va boshqa subyektlar o‘rtasidagi huquqiy munosabatlarni tartibga soladi."],["D","Huquq sohasi (tarmog‘i)","huquqiy normalar tomonidan tartibga solinadigan **munosabatlar majmuidir.**"]]},{"n":19,"title":"Huquqiy munosabatlar","blocks":[["D","Huquqiy munosabatlar","ayrim shaxslar o‘rtasida vujudga keladigan va **huquq normalari bilan tartibga solinadigan** ijtimoiy munosabatlar."],["P","Milliy, diniy, oilaviy va davlatlararo munosabatlar kabi ijtimoiy munosabatlar ham huquq orqali tartibga solinadi."],["D","Misol","Ravshan do‘kondan umumiy daftar va rangli qalam sotib olmoqchi. Bu yerda **umumiy daftar va rangli qalam** huquqiy munosabatning **obyekti** hisoblanadi. **Ravshan** esa huquqiy munosabatning **subyektidir.**"],["P","Huquqiy munosabatlarning elementlari **to‘rtta** ekan:"],["chips",["Obyekt","Subyekt","Subyektiv huquq","Yuridik majburiyat"],4],["P","Huquqiy munosabatlarda ishtirok etuvchilar, ya’ni subyektlar **huquq layoqatiga** hamda **muomala layoqatiga** ega bo‘lishlari talab etiladi."],["D","Obyekt","huquqiy munosabat ishtirokchilarining harakati nimaga qaratilgan bo‘lsa, ushbu narsa."],["D","Subyektlar","huquqiy munosabatlarning ishtirokchilari, ya’ni **huquq va majburiyat egalari.**"],["D","Huquq layoqati","asosan, kishining **tug‘ilishi bilan vujudga keladi** va **vafot etishi bilan tamom bo‘ladi.**"],["D","Muomala layoqati","o‘z harakatlari asosida huquqlarni amalga oshirish va yuridik majburiyatlarni bajara olish imkoniyatidir."],["P","Muomala layoqati yosh va ruhiy salomatlik bilan bog‘liq. Qonunlarga binoan, to‘liq muomala layoqati fuqaro **18 yoshga** to‘lgandan so‘ng boshlanadi. Lekin, ushbu qoidadan istisnolar ham mavjud. Masalan, shaxs jinoiy javobgarlikka **16 yoshdan**, ayrim jinoyatlar uchun **14 yoshdan** tortilishi mumkin. Boshqa bir misol: Oila kodeksi ayrim hollarda 18 yoshga to‘lmasdan turib nikohdan o‘tishga ruxsat beradi. Bunday fuqaro nikohdan o‘tgan vaqtdan boshlab to‘liq muomala layoqatiga ega bo‘ladi."],["D","Huquq manbai","davlat irodasini muayyan **huquqiy-normativ hujjatlar, qonun normalarida** ifodalash, bayon qilish usuli va shakli."],["S","Huquq manbalarining 4 shakli"],["D","1. Huquqiy odat","jamiyat a’zolari tomonidan uzoq vaqt qo‘llanilishi, doimiy takrorlanishi natijasida jamiyat tomonidan qabul qilingan xulq-atvor normasiga aylangan va keyinchalik davlat tomonidan tasdiqlangan qoida. Qadimgi davrlarda asosiy huquq manbai hisoblangan. Hozirgi paytda ham ayrim davlatlarda, masalan, **Buyuk Britaniyada** mavjud."],["D","2. Yuridik pretsedent","sudning umummajburiy ahamiyatga ega bo‘lgan aniq bir ish bo‘yicha qarori. U qabul qilingach, o‘sha masala bo‘yicha umummajburiy qoidaga aylanadi. Buyuk Britaniya, AQSH, Kanada va Avstraliyada huquq manbai hisoblanadi (**anglo-sakson** huquqiy tizimi). Lekin **O‘zbekistonda qo‘llanilmaydi**, sababi, O‘zbekiston **roman-german** huquqiy tizimi (oilasi)ga mansub."],["D","3. Normativ-huquqiy hujjat","huquqning **asosiy manbaidir.** Vakolatli davlat organining belgilangan tartibda qabul qilgan yuridik huquqiy hujjati bo‘lib, umummajburiy xulq-atvor qoidalarini o‘z ichiga oladi."],["D","4. Xalqaro shartnoma","xalqaro huquqning ikki yoki bir necha subyekti tomonidan qabul qilingan bitim bo‘lib, huquq va majburiyatlarni belgilovchi, o‘zgartiruvchi yoki bekor qiluvchi hujjatdir."],["S","Normativ-huquqiy hujjatning belgilari"],["L",["huquqiy normalarni mustahkamlaydi, rasmiylashtiradi","belgilangan qoidalarning mazmunini bayon etadi","belgilangan normalarga umummajburiy tus beradi"]],["S","Normativ-huquqiy hujjatlarning 5 xil turi"],["N",["Qonun, shu jumladan, asosiy qonun hisoblangan – Konstitutsiya","Farmon – davlat boshlig‘ining normativ-huquqiy hujjati","Hukumat qarorlari va farmoyishlari","Vazirliklar va boshqa davlat idoralarining buyruq va qarorlari","Mahalliy vakillik va ijroiya davlat organlarining qarorlari"]]]},{"n":20,"title":"O‘zbekiston Respublikasining qonun manbalari","blocks":[["K","ESLAB QOLING","Qonunning mamlakat ichidagi va xalqaro qoidalari o‘rtasida tafovut bo‘lgan hollarda **xalqaro shartnoma yoki bitimlar ustuvor** hisoblanadi."],["P","Xalqaro huquqning umume’tirof etilgan prinsiplari va normalari hamda O‘zbekiston Respublikasining xalqaro shartnomalari O‘zbekistonning **eng birinchi huquq manbalaridir.** Xalqaro huquqning umume’tirof etilgan prinsiplari va normalari – xalqaro huquqning asosiy qoidalari bo‘lib, ularni xalqaro huquqning barcha subyektlari tan olgan va ularni bajarishga majburdirlar. Davlat suverenitetini hurmat qilish, zo‘rlik ishlatmaslik, davlatning hududiy yaxlitligini tan olish, nizolarni tinch yo‘l bilan hal etish, ichki ishlarga aralashmaslik, xalqlarning teng huquqliligi, insonning huquq va erkinliklarini hurmat qilish, davlatlar o‘rtasidagi hamkorlik, xalqaro huquq bo‘yicha majburiyatlarni bajarish ana shular jumlasidandir."],["P","**1995-yilda** “O‘zbekiston Respublikasining xalqaro shartnomalari to‘g‘risidagi qonuni” qabul qilingan."],["D","Xalqaro shartnoma","xalqaro huquqning ikki yoki undan ortiq subyekti qabul qilgan bitimdir."],["S","O‘zbekiston Respublikasi qonunlarining guruhlari"],["N",["Konstitutsiya – Asosiy qonun","konstitutsiyaviy qonun","qonun","Qoraqalpog‘iston Respublikasining Konstitutsiyasi va qonunlari"]],["P","Qoraqalpog‘iston Respublikasi qonunlari Qoraqalpog‘iston hududida ijro etilishi shart va uning hududidagina amal qiladi."],["D","Konstitutsiya","davlat hokimiyatining tashkil etilishini belgilaydi, konstitutsiyaviy tuzum asoslarini, insonlar va fuqarolarning huquq va erkinliklarini mustahkamlaydi. Konstitutsiya amaldagi qonunlar uchun **yuridik asosdir.** Konstitutsiya qoidalari boshqa normativ hujjatlarda rivojlantiriladi va aniqlashtiriladi. Qoraqalpog‘iston Respublikasining o‘z Konstitutsiyasi bo‘lib, uning qoidalari O‘zbekiston Konstitutsiyasiga zid kelmasligi kerak."],["D","Konstitutsiyaviy qonunlar","Konstitutsiyaga o‘zgartish va qo‘shimchalar kirituvchi qonunlardir. Ular parlament a’zolari umumiy tarkibining **uchdan ikki qismi** ovozi bilan qabul qilinadi."],["D","Qonunlar","o‘z navbatida, **kodekslashtirilgan** va **joriy** qonunlarga bo‘linadi. Kodekslashtirilgan qonunlarga kodekslar kiradi. Kodeks mantiqiy tizimlashtirish xususiyatiga ega qonun bo‘lib, ijtimoiy munosabatlarning ma’lum bir sohasini batafsil tartibga soluvchi normalarni birlashtiradi. Masalan, Fuqarolik kodeksi, Jinoyat kodeksi, Mehnat kodeksi, Soliq kodeksi, Bojxona kodeksi va h.k."],["T",["Qonun kuchga kiradi","Qonun kuchini yo‘qotadi"],[["rasman e’lon qilinganidan ma’lum muddat o‘tgach","qonunning o‘zida ko‘rsatilgan muddat tugagan bo‘lsa"],["qonunda yoki maxsus hujjatda ko‘rsatilgan vaqtdan boshlab","ushbu qonun bekor qilinishi natijasida"]],[1,1]],["P","**Qonunning orqaga qaytish kuchi** amalda kam qo‘llaniladi. O‘zbekistonda jinoyat yoki ma’muriy javobgarlikni yengillashtiruvchi qonunlar ayrim hollarda orqaga qaytish kuchiga ega bo‘lishi mumkin."],["P","Qonun **zamonda** amal qiladi, ya’ni qonun muayyan muddat davomida amal qiladi. Bu muddat qonunda ko‘rsatilgan sanadan boshlanadi. Qonun **makonda** amal qiladi. Ya’ni, qonunlar mamlakatning barcha hududlarida amal qiladi."],["S","Qonun osti hujjatlari (qonunlar asosida qabul qilinadi)"],["N",["Prezident farmonlari","Hukumat qarorlari","Boshqa ijroiya organlarning normativ hujjatlari"]],["P","O‘zbekistonda vazirliklar hamda tashkilotlarning, fuqarolarning huquqlari va qonuniy manfaatlariga daxldor normativ hujjatlarni qayd etish davlat tizimi joriy etilgan. Ushbu vazifa **Adliya vazirligi** zimmasiga yuklatilgan."]]},{"n":21,"title":"Huquqiy ong va huquqiy madaniyat","blocks":[["D","Huquqiy ong","insonning o‘z ma’rifat va ma’naviyat darajasiga tayangan holda jamiyatda amal qilayotgan **huquqiy talab va normalarning mazmunini tushunish** va mohiyatini anglashidir."],["D","Shaxsning huquqiy madaniyati","fuqaroning o‘z haq-huquqlarini huquqiy ongiga tayangan holda **o‘zgalar manfaatiga zid kelmaydigan tarzda** amalga oshirishi tushuniladi."],["P","**2019-yilning 9-yanvar** kuni Prezidentimiz tomonidan “Jamiyatda huquqiy ong va huquqiy madaniyatni yuksaltirish tizimini tubdan takomillashtirish to‘g‘risida”gi **farmonga** imzo chekildi."],["P","Farmonda keng qamrovli huquqiy targ‘ibot tadbirlarini tashkil qilish davlat organlari va tashkilotlarining ustuvor vazifalaridan ekanligi ta’kidlanadi."],["P","Farmonga binoan: Jamiyatda huquqiy madaniyatni yuksaltirish konsepsiyasi va shu Konsepsiyani 2019-yilda samarali amalga oshirish bo‘yicha “Yo‘l xaritasi” ham tasdiqlangan."],["K","MUVOFIQLASHTIRUVCHI ORGAN","Jamiyatda huquqiy ong va huquqiy madaniyatni yuksaltirish sohasida muvofiqlashtiruvchi davlat organi etib **O‘zbekiston Respublikasi Adliya vazirligi** belgilangan."],["P","Farmonda Adliya vazirligiga jamiyatda huquqiy ong va huquqiy madaniyatni yuksaltirish bo‘yicha qator chora-tadbirlarni amalga oshirish, ishlarni amalga oshiruvchilarning faoliyatini muvofiqlashtirish, zarur tavsiyalarni tayyorlash, zarur takliflar ishlab chiqish bo‘yicha qo‘shimcha vazifalar yuklatilgan."],["S","Adliya vazirligining ma’qullangan takliflari"],["L",["O‘zbekiston Respublikasining milliy huquqiy internet portalini yaratish","**Advice.uz** huquqiy axborot tizimini yaratish","umumta’lim maktablari va akademik litseylarda huquqiy bilimlarga doir o‘quv mashg‘ulotlari ko‘lamini yanada kengaytirish","huquqiy qo‘llanmalarni yaratish va aholiga tarqatish","“Huquqiy targ‘ibot ishlari a’lochisi” ko‘krak nishonini ta’sis etish"]]]},{"n":22,"title":"Huquqbuzarlik","blocks":[["Q","Jamiyatimizda “Qonun va adolat – ustuvor, jinoyatga jazo – muqarrar” degan prinsipni qaror toptirish uchun bor kuch va imkoniyatlarimizni safarbar etamiz.","Shavkat Mirziyoyev"],["P","Shaxslar ma’lum huquqiy qoidalarga, huquq normalariga amal qiladilar. Bu qoidalarga amal qilmaslik, o‘rnatilgan huquqiy normalarning buzilishiga olib keladi. Bu esa **huquqbuzarlik** deb ataladi."],["D","Huquqbuzarlik","o‘z xatti-harakatini tushunadigan va unga javob bera oladigan shaxsning **huquqqa zid xatti-harakatidan kelib chiquvchi aybidir.**"],["S","Huquqbuzarlikning 4 belgisi"],["chips",["Ijtimoiy xavflilik","Huquqqa zidlik","Ayblilik","Jazoga loyiqlik"],4],["D","Jinoyat","jamiyat uchun xavfli bo‘lgan qilmish (harakat yoki harakatsizlik). Jinoyat kodeksi bilan taqiqlangan, aybli ijtimoiy xavfli qilmish jazo qo‘llash tahdidi bilan jinoyat deb topiladi."],["D","Ijtimoiy xavflilik","huquqbuzar jamiyatning qadriyatlariga tajovuz qiladi, inson hayotiga suiqasd qiladi, davlat va boshqa insonlarga zarar keltiradi, ularning mol-mulkini nobud qiladi hamda noxush hodisalar keltirib chiqarib, jamiyat a’zolari manfaatiga zarar keltiradi. O‘z oilasi, ota-onasi, jamoasi, yor-u birodarlarini qiyin, uyatli ahvolga solib qo‘yadi. Eng yomoni u o‘z kelajagini barbod qiladi."],["D","Huquqqa zidlik","huquqbuzarning qonun yoki huquq normalari belgilab qo‘ygan **majburiy talablarini buzishidir.**"],["D","Ayblilik","o‘z xatti-harakatini tushunadigan va unga javob bera oladigan insonning huquqqa zid, qonun talablariga qarshi xatti-harakatidan kelib chiquvchi aybidir. Ayblilik **qasddan** yoki **ehtiyotsizlik** oqibatida sodir bo‘ladi."],["P","Inson inson sifatida dunyoga kelgan ekan, uning oldida doimo ikki yo‘l – **birinchisi:** huquqiy normalarga, qonun talablariga vijdonan yoki majburiy bo‘ysungan holda o‘z kelajagini yaratish, jamiyat uchun, o‘z xalqi uchun ijtimoiy foyda keltirish. **Ikkinchi yo‘l** esa hayoti davomida huquqqa xilof, huquqiy norma va qonun talablarini mensimasdan, bo‘ysunmasdan yashash. Aybli harakat qilish, jamiyatga zarar yetkazishdir."],["D","Jazoga loyiqlik","har qanday huquqbuzarlik sodir etgan shaxsning vakolatli davlat organi tomonidan **javobgarlikka tortilishi**, jazo esa huquqbuzarlik sodir etgan shaxsga nisbatan qo‘llaniladigan, huquqbuzarni muayyan huquq va erkinliklardan mahrum qilishdan iborat majburlov chorasidir."],["S","Huquqbuzarlik odatda 4 guruhga bo‘linadi"],["D","Intizomiy huquqbuzarlik","xizmat burchini bajarib turganda har qanday mehnatda majburiy bo‘lgan mehnat tartib-qoidalarining va rahbarlikka bo‘ysunish tamoyillarining buzilishi. **Masalan:** ishga, o‘qishga kech qolish; ishga yoki o‘qishga sababsiz kelmaslik yoki sababsiz ketib qolish; ishga mast holda, spirtli ichimliklar, narkotik moddalar iste’mol qilgan holda kelish va boshqalar."],["D","Fuqarolik huquqbuzarligi","insonlarning mulkiga yoki shaxsiga qarshi qonunga xilof harakat (yoki harakatsizlik) natijasida yetkazilgan zarar. **Masalan:** bir shaxsdan qarz olib, uni vaqtida qaytarmaslik; shartnomalarni, majburiyatlarni bajarmaslik va boshqalar."],["D","Ma’muriy huquqbuzarlik","qonunga binoan ma’muriy javobgarlikka tortish nazarda tutilgan, fuqarolarga, tabiiy muhitga nisbatan (qasddan yoki ehtiyotsizlikdan) sodir etilgan harakat yoki harakatsizlik. **Masalan:** mayda bezorilik."],["D","Jinoiy huquqbuzarlik","jinoyat sodir etish, ya’ni o‘g‘rilik, talonchilik, odam o‘ldirish, ichki ishlar xodimiga qarshilik ko‘rsatish va boshqalar."],["D","Huquqbuzarlik obyekti","huquq bilan tartibga solinadigan va muhofaza qilinadigan **ijtimoiy munosabatlar.** Odamlar ijtimoiy hayotda o‘z xatti-harakatlariga javob berishga majburlar. Ular ijtimoiy hayotda bir-birlari bilan o‘zaro munosabatga kirishadilar. Aynan mana shu munosabatlar — ijtimoiy munosabatlar."],["D","Huquqbuzarlik subyekti","huquqqa zid aybli qilmishni sodir etgan shaxs. Aynan shu shaxs **huquqbuzar** deb ataladi. Har qanday shaxs ham huquqbuzar deb tan olinavermaydi. Huquqbuzarlik subyekti deb tan olinishi uchun shaxs o‘z qilmishiga javob bera oladigan, **aqli raso** bo‘lishi shart."]]}],"quiz":{"1":[{"q":"1948-yilda BMT Bosh Assambleyasi qaysi hujjat var T = D.topics, QZ = D.quiz;
var $ = function(s, el){ return (el||document).querySelector(s); };
var $$ = function(s, el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>'); }
function plain(s){ return String(s).replace(/\*\*(.+?)\*\*/g,'$1'); }
function sent(s){ s = String(s).toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
function cls(n){ return 't' + ((n-1) % 5); }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[‘’ʻʼ`´]/g,"'"); }

  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
var S = store.get('hq-portal-1', null) || {};

function blockText(b){
  var k = b[0];
  if (k==='P'||k==='S'||k==='E') return plain(b[1]);
  if (k==='D'||k==='K'||k==='Q') return plain(b[1]+' '+b[2]);
  if (k==='N'||k==='L') return b[1].map(plain).join(' ');
  if (k==='T') return b[1].join(' ')+' '+b[2].map(function(r){return r.join(' ');}).join(' ');
  if (k==='grid') return b[1].map(function(c){return c[0]+' '+c[1].join(' ');}).join(' ');
  if (k==='chips') return b[1].join(' ');
  if (k==='power') return 'Prezident Qonun chiqaruvchi hokimiyat Oliy Majlis Ijro etuvchi hokimiyat Vazirlar Mahkamasi Sud hokimiyati Konstitutsiyaviy sud Oliy Sud';
  if (k==='forms') return 'Davlatning shakllari Boshqaruv shakli Monarxiya Respublika Tuzilish shakli Unitar Federativ Konfederativ Siyosiy tartibot Demokratik Nodemokratik';
  if (k==='funcs') return 'Davlatning funksiyalari ichki tashqi';
  return '';
}
T.forEach(function(t){
  t.text = t.blocks.map(blockText).join(' ');
  t.mins = Math.max(1, Math.round(t.text.split(/\s+/).length / 140));
});
