<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huquq qo‘llanma — 8-sinf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA; --paper:#FFFFFF; --ink:#14213D; --ink2:#44506A; --muted:#6B778C; --line:#DDE3EC;
  --on:#FFFFFF; --hdr:rgba(255,255,255,.88); --ok:#0E9F6E; --bad:#DC2F3C;
  --head:'Bricolage Grotesque','Onest',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1322; --paper:#131C30; --ink:#E7ECF6; --ink2:#B6C0D4; --muted:#8793AA; --line:#25314B;
    --on:#0C1322; --hdr:rgba(12,19,34,.88); --ok:#34D399; --bad:#FF7B80;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1322; --paper:#131C30; --ink:#E7ECF6; --ink2:#B6C0D4; --muted:#8793AA; --line:#25314B;
  --on:#0C1322; --hdr:rgba(12,19,34,.88); --ok:#34D399; --bad:#FF7B80;
}
.t0{--c:#0E9F8E;--tr:14,159,142}
.t1{--c:#4F46E5;--tr:79,70,229}
.t2{--c:#E5484D;--tr:229,72,77}
.t3{--c:#D97706;--tr:217,119,6}
.t4{--c:#2563EB;--tr:37,99,235}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) .t0{--c:#2DD4BF;--tr:45,212,191}
:root:not([data-theme="light"]) .t1{--c:#9A94FF;--tr:154,148,255}
:root:not([data-theme="light"]) .t2{--c:#FF8A8E;--tr:255,138,142}
:root:not([data-theme="light"]) .t3{--c:#FBB13C;--tr:251,177,60}
:root:not([data-theme="light"]) .t4{--c:#6EA8FF;--tr:110,168,255}
}
:root[data-theme="dark"] .t0{--c:#2DD4BF;--tr:45,212,191}
:root[data-theme="dark"] .t1{--c:#9A94FF;--tr:154,148,255}
:root[data-theme="dark"] .t2{--c:#FF8A8E;--tr:255,138,142}
:root[data-theme="dark"] .t3{--c:#FBB13C;--tr:251,177,60}
:root[data-theme="dark"] .t4{--c:#6EA8FF;--tr:110,168,255}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--body);-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c,#2563EB);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- yuqori panel ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem/1 var(--head);letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.top nav{display:flex;gap:4px;margin-left:10px}
.top nav a{padding:8px 13px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink2)}
.top nav a:hover{background:var(--line)}
.top nav a.on{background:var(--ink);color:var(--bg)}
.top form{margin-left:auto;flex:0 1 260px}
.top input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95rem}
.ibtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--line)}
#menu{display:none}

/* ---- sahifa tuzilishi ---- */
.shell{display:grid;grid-template-columns:285px minmax(0,1fr);gap:0;max-width:1240px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;max-height:calc(100vh - 62px - env(safe-area-inset-top,0px));overflow:auto;padding:18px 10px 40px 14px}
.side-h{font:700 .9rem/1 var(--body);color:var(--muted);padding:4px 10px 10px}
.tab{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border-left:5px solid var(--c);margin-bottom:5px;background:transparent}
.tab:hover{background:rgba(var(--tr),.10)}
.tab.on{background:rgba(var(--tr),.16)}
.tab .tn{font:800 .95rem/1 var(--head);color:var(--c);min-width:1.4em}
.tab .tt{font-size:.88rem;line-height:1.3;font-weight:500;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tab .ck{color:var(--ok);font-weight:800;font-size:.9rem}
main{padding:26px 28px 80px;min-width:0}
#app{max-width:780px;margin:0 auto}
.scrim{display:none}

/* ---- bosh sahifa ---- */
.hero h1{font:800 clamp(2.2rem,5.4vw,3.6rem)/1.02 var(--head);letter-spacing:-.025em;margin:6px 0 12px}
.hero p{margin:0;color:var(--ink2);max-width:52ch}
.prog{display:flex;align-items:center;gap:14px;margin:22px 0 6px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,#0E9F8E);border-radius:99px;transition:width .4s}
.prog b{font:800 1rem var(--head);white-space:nowrap}
.quick{margin:26px 0 8px;padding:20px 22px;border-radius:18px;background:var(--ink);color:var(--bg)}
.quick h2{margin:0 0 4px;font:700 .95rem var(--body);opacity:.75}
.quick .qq{font:700 1.3rem/1.3 var(--head);margin:0 0 14px}
.quick .opts{display:grid;gap:8px}
.quick .opt{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:inherit}
:root[data-theme="dark"] .quick .opt,:root[data-theme="dark"] .quick .opt{background:rgba(12,19,34,.08);border-color:rgba(12,19,34,.25)}
.quick .fb{margin-top:12px;font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:700}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.fill{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--on)}
.btn.fill:hover{filter:brightness(1.08);background:var(--c,var(--ink));color:var(--on)}
.btn.sm{padding:7px 13px;font-size:.92rem;border-radius:10px}
h2.sec{font:800 1.5rem/1.2 var(--head);margin:36px 0 14px;letter-spacing:-.01em}
.idx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ic{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 12px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px 14px 14px 6px}
.ic:hover{background:rgba(var(--tr),.09)}
.ic .n{font:800 1.7rem/1 var(--head);color:var(--c);min-width:1.5em}
.ic .t{font-weight:600;line-height:1.3;font-size:.98rem}
.ic .s{display:block;color:var(--muted);font-size:.82rem;margin-top:4px;font-weight:500}
.ic .s.done{color:var(--ok)}

/* ---- mavzu ---- */
.th{display:flex;gap:18px;align-items:stretch;margin:2px 0 20px}
.th .num{flex:none;width:76px;display:grid;place-items:center;background:var(--c);color:var(--on);font:800 2.6rem/1 var(--head);border-radius:6px 18px 18px 6px}
.th h1{margin:0;font:800 clamp(1.5rem,3.6vw,2.2rem)/1.12 var(--head);letter-spacing:-.015em}
.th .meta{color:var(--muted);font-size:.9rem;margin-top:6px}
.doc p{margin:0 0 14px}
.doc h3{font:700 1.15rem/1.3 var(--head);color:var(--c);margin:26px 0 10px}
.hl{color:var(--c);font-weight:700}
.def{background:rgba(var(--tr),.10);border-left:5px solid var(--c);padding:13px 18px 5px;border-radius:4px 14px 14px 4px;margin:16px 0}
.def h4{margin:0 0 3px;font:700 1rem/1.3 var(--head);color:var(--c)}
.def p{font-size:1rem;margin:0 0 10px}
.ety{font-style:italic;color:#8A5A00;background:rgba(245,158,11,.13);border:1px dashed rgba(217,119,6,.55);border-radius:10px;padding:8px 14px;font-size:.95rem}
:root[data-theme="dark"] .ety{color:#FBC768}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ety{color:#FBC768}}
.key{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px 6px;margin:18px 0}
.key h4{margin:0 0 3px;font:700 .95rem/1.3 var(--body);color:#FBBF24}
:root[data-theme="light"] .key h4{color:#FBBF24}
.key p{margin:0 0 10px;font-size:1.02rem}
.key .hl{color:#FBBF24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .key h4,:root:not([data-theme="light"]) .key .hl{color:#B45309}}
:root[data-theme="dark"] .key h4,:root[data-theme="dark"] .key .hl{color:#B45309}
.doc figure{margin:20px 0;padding:6px 0 6px 20px;border-left:5px solid var(--c)}
.doc blockquote{margin:0;font:600 1.15rem/1.5 var(--head);color:var(--ink)}
.doc figcaption{margin-top:6px;color:var(--c);font-weight:700;font-size:.92rem}
.nl{list-style:none;margin:12px 0 18px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.nl li{display:flex;gap:0;align-items:stretch;border-top:1px solid var(--line)}
.nl li:first-child{border-top:0}
.nl .no{flex:none;width:38px;display:grid;place-items:center;background:var(--c);color:var(--on);font:800 .9rem var(--head)}
.nl .tx{padding:8px 14px;font-size:1rem;line-height:1.45}
.nl li:nth-child(even) .tx{background:rgba(var(--tr),.06)}
.bl{list-style:none;margin:10px 0 18px;padding:0}
.bl li{position:relative;padding:6px 0 6px 24px;border-bottom:1px solid var(--line)}
.bl li::before{content:"";position:absolute;left:5px;top:.95em;width:8px;height:8px;border-radius:2px;background:var(--c);transform:rotate(45deg)}
.tw{overflow-x:auto;margin:14px 0 20px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.tw table{border-collapse:collapse;width:100%;min-width:480px;font-size:.96rem}
.tw th{background:var(--c);color:var(--on);text-align:left;padding:9px 14px;font-weight:700}
.tw td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.tw td.f{font-weight:700;color:var(--c)}
.tw tr:nth-child(even) td{background:rgba(var(--tr),.06)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 20px}
.gc{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:6px 6px 14px 14px;background:var(--paper);padding:10px 14px 8px}
.gc h5{margin:0 0 6px;font:700 1rem/1.3 var(--head);color:var(--c)}
.gc ul{margin:0;padding:0;list-style:none;font-size:.96rem}
.gc li{padding:3px 0 3px 16px;position:relative;line-height:1.45}
.gc li::before{content:"";position:absolute;left:2px;top:.8em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.chips{display:grid;gap:10px;margin:14px 0 20px}
.chips div{padding:12px 12px;text-align:center;font-weight:700;line-height:1.35;font-size:.98rem;background:rgba(var(--tr),.12);border-top:4px solid var(--c);border-radius:4px 4px 12px 12px;display:grid;place-items:center}
.pw{margin:18px 0 22px;display:grid;gap:6px}
.pw .top1{background:var(--ink);color:var(--bg);text-align:center;font:800 1.2rem var(--head);padding:12px;border-radius:12px}
.pw .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pw .col{border-radius:12px;overflow:hidden;background:rgba(var(--tr),.12);text-align:center}
.pw .col b{display:block;background:var(--c);color:var(--on);padding:9px 8px;font-size:.95rem;line-height:1.3}
.pw .col span{display:block;padding:12px 8px;font-size:.93rem;line-height:1.4}
.fm{margin:18px 0 22px;display:grid;gap:6px}
.fm .hd{background:var(--ink);color:var(--bg);text-align:center;font:800 1.1rem var(--head);padding:10px;border-radius:12px}
.fm .r{display:grid;grid-template-columns:.9fr 1fr 1fr;gap:6px}
.fm .r>*{padding:11px 12px;border-radius:10px;font-weight:600}
.fm .r>b{background:var(--c);color:var(--on)}
.fm .r>span{background:rgba(var(--tr),.13);text-align:center}
.fn{margin:18px 0 22px;display:grid;gap:6px}
.fn .hd{background:var(--ink);color:var(--bg);text-align:center;font:800 1.1rem var(--head);padding:10px;border-radius:12px}
.fn .r{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fn .c{border-radius:12px;overflow:hidden;background:rgba(var(--tr),.12)}
.fn .c b{display:block;background:var(--c);color:var(--on);text-align:center;padding:8px}
.fn .c ul{margin:0;padding:10px 14px 10px 28px;font-size:.93rem;line-height:1.45}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 6px rgba(var(--tr,37,99,235),.45)}100%{box-shadow:0 0 0 6px rgba(var(--tr,37,99,235),0)}}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:34px 0 8px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.pn a{flex:1;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.95rem;line-height:1.3}
.pn a small{display:block;color:var(--muted);font-weight:500}
.pn a:last-child{text-align:right}
.pn a:hover{border-color:var(--c)}

/* ---- test ---- */
.qbox{margin-top:34px;padding:22px;border-radius:18px;background:rgba(var(--tr),.09);border:1px solid rgba(var(--tr),.3)}
.qbox>h2{margin:0 0 4px;font:800 1.4rem var(--head)}
.qbox>p{margin:0 0 16px;color:var(--ink2);font-size:.97rem}
.qz-top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:.92rem;margin-bottom:12px}
.qz-tag{margin:0 0 4px;color:var(--c);font-weight:700;font-size:.88rem}
.qz-q{font:700 1.25rem/1.3 var(--head);margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(14,159,110,.14);font-weight:700}
.opt.wrong{border-color:var(--bad);background:rgba(220,47,60,.12)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:.97rem}
.fb strong.y{color:var(--ok)} .fb strong.n{color:var(--bad)}
.fb .btn{margin-top:10px}
.res{text-align:center;padding:10px 0}
.res .big{font:800 3.4rem/1 var(--head);color:var(--c)}
.res p{margin:8px 0 16px;color:var(--ink2)}
.setup{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}

/* ---- kartochkalar ---- */
.cbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.cbar select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;max-width:100%}
.cbar label{display:flex;gap:6px;align-items:center;font-size:.95rem}
.fc{perspective:1200px;margin:16px 0}
.fci{position:relative;height:290px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 22px 22px 6px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.face.fr{background:var(--c);color:var(--on);border-left:10px solid rgba(0,0,0,.18)}
.face.fr .tg{font-weight:600;font-size:.9rem;opacity:.85;margin-bottom:10px}
.face.fr .tm{font:800 clamp(1.5rem,4vw,2.2rem)/1.15 var(--head)}
.face.fr .hint{margin-top:18px;font-size:.88rem;opacity:.8}
.face.bk{transform:rotateY(180deg);background:var(--paper);border:2px solid var(--c);font-size:1.05rem;line-height:1.55}
.face.bk .tg{color:var(--c);font-weight:700;margin-bottom:8px;font-family:var(--head)}
.cnav{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
.cnt{text-align:center;color:var(--muted);font-weight:600;font-size:.92rem;margin-top:10px}

/* ---- qidiruv ---- */
.sr{display:block;padding:12px 14px;margin-bottom:8px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:4px 12px 12px 4px}
.sr:hover{background:rgba(var(--tr),.08)}
.sr b{display:block;color:var(--c);font-size:.88rem;margin-bottom:2px}
.sr span{font-size:.97rem;line-height:1.5}
mark{background:rgba(245,158,11,.4);color:inherit;border-radius:3px;padding:0 2px}
.empty{padding:26px;border:1px dashed var(--line);border-radius:14px;color:var(--ink2);text-align:center}
footer.f{max-width:780px;margin:0 auto;padding:10px 0 0;color:var(--muted);font-size:.88rem}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #menu{display:grid}
  .top nav{display:none}
  .top form{flex:1;margin-left:0}
  .side{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(310px,86vw);max-height:none;background:var(--paper);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.5)}
  main{padding:18px 16px 80px}
  .idx,.g2,.fn .r{grid-template-columns:minmax(0,1fr)}
  .pw .row{grid-template-columns:minmax(0,1fr)}
  .th .num{width:58px;font-size:2rem}
  .fm .r{grid-template-columns:1fr}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .mnav{display:flex!important}
}
.mnav{display:none;gap:6px;margin:0 0 16px;overflow-x:auto}
.mnav a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.92rem;white-space:nowrap}
.mnav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<header class="top">
  <button class="ibtn" id="menu" aria-label="Mavzular ro‘yxatini ochish">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/" aria-label="Bosh sahifa">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#14213D"/><path d="M16 6v17M9 25h14M7 11h18" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M7 11l-3 7a3.4 3.4 0 0 0 6 0zM25 11l-3 7a3.4 3.4 0 0 0 6 0z" fill="#F59E0B"/></svg>
    <span>Huquq qo‘llanma</span>
  </a>
  <nav aria-label="Asosiy bo‘limlar">
    <a href="#/" data-r="home">Bosh sahifa</a>
    <a href="#/cards" data-r="cards">Kartochkalar</a>
    <a href="#/test" data-r="test">Test</a>
  </nav>
